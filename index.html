<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我的一日三餐</title>
<style>
:root{
  --bg:#FBF1E7;
  --card-bg:#FFFFFF;
  --ink:#2A2620;
  --ink-soft:#6B6660;
  --ink-faint:#9C968C;
  --line:#F0E4D6;
  --accent:#E08A5B;
  --accent-ink:#FFFFFF;
  --accent-soft:#FBE3D2;
  --pin:#E0616B;
  --purple:#8B7FD1;
  --blue:#5B8DEF;
  --green-bg:#E3F5EA;
  --green-ink:#2F9E5B;
  --danger-bg:#FBE4E2;
  --danger-ink:#C4544A;
  --input-bg:#FFFFFF;
  --input-line:#E9DACB;
  --sheet-bg:#FBF1E7;
  --shadow: 0 8px 22px rgba(60,45,25,0.08);
  color-scheme: light;
}
:root:not([data-theme="light"]) {
  @media (prefers-color-scheme: dark) {
    --bg:#221C15;
    --card-bg:#2B2419;
    --ink:#F1E7D8;
    --ink-soft:#C7B79D;
    --ink-faint:#8B7C64;
    --line:#40331F;
    --accent:#E4966A;
    --accent-ink:#221C15;
    --accent-soft:#3C2C1C;
    --pin:#E27B7B;
    --purple:#A79BE0;
    --blue:#7FA3F2;
    --green-bg:#233A28;
    --green-ink:#6BC98D;
    --danger-bg:#3C2621;
    --danger-ink:#E2867B;
    --input-bg:#2B2419;
    --input-line:#40331F;
    --sheet-bg:#221C15;
    --shadow: 0 8px 22px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"]{
  --bg:#221C15;
  --card-bg:#2B2419;
  --ink:#F1E7D8;
  --ink-soft:#C7B79D;
  --ink-faint:#8B7C64;
  --line:#40331F;
  --accent:#E4966A;
  --accent-ink:#221C15;
  --accent-soft:#3C2C1C;
  --pin:#E27B7B;
  --purple:#A79BE0;
  --blue:#7FA3F2;
  --green-bg:#233A28;
  --green-ink:#6BC98D;
  --danger-bg:#3C2621;
  --danger-ink:#E2867B;
  --input-bg:#2B2419;
  --input-line:#40331F;
  --sheet-bg:#221C15;
  --shadow: 0 8px 22px rgba(0,0,0,0.35);
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}
#app{max-width:680px;margin:0 auto;padding:20px 16px 48px;}

header.top{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
header.top .emoji{font-size:26px;}
header.top h1{font-size:23px;margin:0;font-weight:800;}
header.top .sub{font-size:12.5px;color:var(--ink-faint);margin-top:2px;}

.tabbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:20px;}
.tabbar::-webkit-scrollbar{display:none;}
.tabbar button{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:11px 16px;border-radius:14px;
  border:1px solid var(--line);background:var(--card-bg);color:var(--ink-soft);
  font-size:13.5px;font-weight:600;box-shadow:var(--shadow);
}
.tabbar button.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}

.section{display:none;}
.section.active{display:block;}

.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
.sectionhead h2{font-size:17px;margin:0;display:flex;align-items:center;gap:7px;}
.pillbtn{border:0;background:var(--accent);color:var(--accent-ink);padding:10px 15px;border-radius:12px;font-size:13px;font-weight:700;white-space:nowrap;}

.subtabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;}
.subtabs::-webkit-scrollbar{display:none;}
.subtab{flex:0 0 auto;padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:var(--card-bg);color:var(--ink-soft);font-size:13px;}
.subtab.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700;}

.card{background:var(--card-bg);border-radius:18px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow);}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
.card-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;min-width:0;}
.card-title .ic{font-size:18px;flex:0 0 auto;}
.card-title .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.meta{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-soft);margin-top:6px;}
.meta .dot{width:20px;height:20px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;flex:0 0 auto;}
.meta .dot.cat{background:var(--accent-soft);color:var(--accent);}
.meta .dot.link{background:#EAE6FB;color:var(--purple);}
.foothint{font-size:12px;color:var(--ink-faint);margin-top:10px;}

.pickpill{flex:0 0 auto;border:0;border-radius:10px;padding:8px 12px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:700;white-space:nowrap;}
.pickpill.picked{background:var(--accent);color:var(--accent-ink);}

.statusbar{background:var(--green-bg);color:var(--green-ink);text-align:center;border-radius:12px;padding:9px;font-size:12.5px;font-weight:700;margin:-4px 0 12px;}

.empty{text-align:center;color:var(--ink-faint);padding:40px 20px;line-height:1.8;font-size:13.5px;}

.record-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px solid var(--line);}
.record-item:last-child{border-bottom:none;}
.record-item .rtxt{font-size:14.5px;}
.cancel-pick,.delete-record{border:0;border-radius:9px;padding:6px 11px;background:var(--danger-bg);color:var(--danger-ink);font-size:12px;flex:0 0 auto;}
.card h3.groupname{font-size:13px;color:var(--ink-soft);margin:0 0 6px;display:flex;align-items:center;gap:6px;}
.card .group{margin-bottom:14px;}
.card .group:last-child{margin-bottom:0;}
.datehead{font-size:13.5px;font-weight:700;color:var(--ink-soft);margin:0 0 8px;}

.modal{position:fixed;inset:0;background:rgba(30,20,10,0.42);display:none;align-items:flex-end;z-index:30;}
.modal.show{display:flex;}
.modal-sheet{width:100%;max-width:680px;margin:auto;background:var(--sheet-bg);border-radius:22px 22px 0 0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;}
.modal-sheet h2{margin-top:0;font-size:18px;}
.back-button{border:1px solid var(--line);background:var(--card-bg);color:var(--ink-soft);border-radius:12px;padding:9px 14px;margin-bottom:14px;font-size:13.5px;}
label{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:8px;}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--input-line);border-radius:12px;margin:6px 0 12px;background:var(--input-bg);color:var(--ink);font-size:14.5px;font-family:inherit;}
.field-error{color:var(--danger-ink);font-size:12.5px;margin:-8px 0 10px;display:none;}
.modal-actions{display:flex;gap:8px;}
.modal-actions button{flex:1;padding:11px;border-radius:12px;font-size:14px;font-weight:600;}
.cancel-button{background:var(--card-bg);border:1px solid var(--line);color:var(--ink-soft);}
.save-button{background:var(--accent);color:var(--accent-ink);border:0;}
.action-row{display:flex;gap:8px;margin-top:16px;}
.action-row button{flex:1;padding:11px;border-radius:12px;font-size:14px;font-weight:600;}
.edit-button{background:var(--card-bg);border:1px solid var(--line);color:var(--ink-soft);}
.delete-button{background:var(--danger-bg);border:0;color:var(--danger-ink);}
.detail-title{margin-top:18px;margin-bottom:6px;font-size:13.5px;color:var(--ink-soft);}
.detail-text{line-height:1.7;white-space:pre-wrap;font-size:14.5px;}
.recipe-link{color:var(--purple);word-break:break-all;font-size:13.5px;}
.detail-hero{background:linear-gradient(135deg,var(--accent-soft),var(--card-bg));border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;}
.detail-hero h2{margin:0 0 8px;font-size:22px;line-height:1.35;}
.detail-section{background:var(--card-bg);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-top:10px;}
.detail-section .detail-title{margin:0 0 10px;font-weight:800;color:var(--ink);}
.detail-section .detail-text{color:var(--ink-soft);}
.detail-section .recipe-link{display:block;background:var(--accent-soft);padding:10px 12px;border-radius:10px;text-decoration:none;}
.confirm-sheet{max-width:340px;border-radius:18px;}
.confirm-msg{font-size:14.5px;line-height:1.7;margin-bottom:18px;}

.formsec-head{font-size:14px;font-weight:700;margin:18px 0 10px;display:flex;align-items:center;gap:6px;}
.ingr-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;align-items:center;}
.ingr-row input,.ingr-row select{margin:0;}
.ingr-row input.iname{flex:1 1 120px;}
.ingr-row input.iamount{flex:1 1 90px;}
.ingr-row select.igroup{flex:0 0 128px;}
.rowdel{flex:0 0 auto;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--line);color:var(--ink-soft);font-size:15px;display:flex;align-items:center;justify-content:center;padding:0;}
.step-row{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start;}
.step-row .stepnum{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:8px;}
.step-row textarea{flex:1;margin:0;min-height:52px;resize:vertical;}
.step-row .rowdel{align-self:flex-start;margin-top:0;}
.addrow-btn{width:100%;padding:12px;border-radius:12px;border:1.5px dashed var(--accent);background:transparent;color:var(--accent);font-size:13.5px;font-weight:600;margin-bottom:18px;}
.meal-sheet{max-width:400px;border-radius:18px;}
.meal-title{font-size:15px;font-weight:700;margin-bottom:14px;}
.meal-options{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
.meal-option{
  display:flex;align-items:center;gap:10px;
  padding:13px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--card-bg);color:var(--ink);font-size:15px;font-weight:600;
}
.meal-option .ic{font-size:18px;}
.meal-option:active{background:var(--accent-soft);border-color:var(--accent);}
.settings-actions{display:grid;grid-template-columns:1fr;gap:9px;margin-top:14px;}
.setting-btn{width:100%;border:1px solid var(--line);background:var(--card-bg);color:var(--ink);padding:12px 14px;border-radius:12px;font-size:14px;font-weight:700;text-align:left;}
.setting-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.setting-btn.danger{background:var(--danger-bg);border-color:transparent;color:var(--danger-ink);}
.backup-alert{background:#FFF3CD;color:#7A5A00;border:1px solid #F4D77A;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:13px;line-height:1.55;}
:root[data-theme="dark"] .backup-alert{background:#403617;color:#F2D77C;border-color:#6A5924;}
</style>
</head>
<body>
<div id="app">

  <header class="top">
    <div class="emoji">🥗</div>
    <div>
      <h1>我的一日三餐</h1>
      <div class="sub">菜单 · 今日菜单 · 点菜记录</div>
    </div>
  </header>

  <nav class="tabbar" id="tabbar">
    <button data-tab="menu" onclick="switchTab('menu')">🍽️ 菜单</button>
    <button data-tab="today" onclick="switchTab('today')">📅 今日菜单</button>
    <button data-tab="record" onclick="switchTab('record')">📋 点菜记录</button>
    <button data-tab="settings" onclick="switchTab('settings')">⚙️ 设置</button>
  </nav>

  <section id="menuSection" class="section active">
    <div class="sectionhead">
      <h2>🍽️ 菜单</h2>
      <button class="pillbtn" onclick="openAddFood()">＋ 增加食物</button>
    </div>
    <div class="subtabs" id="subtabs">
      <button class="subtab active" data-category="全部" onclick="changeCategory('全部')">全部</button>
      <button class="subtab" data-category="早餐" onclick="changeCategory('早餐')">早餐</button>
      <button class="subtab" data-category="午餐/晚餐" onclick="changeCategory('午餐/晚餐')">午餐/晚餐</button>
    </div>
    <div id="foodList"></div>
  </section>

  <section id="todaySection" class="section">
    <div class="sectionhead"><h2>📅 今日菜单</h2></div>
    <div id="todayList"></div>
  </section>

  <section id="recordSection" class="section">
    <div class="sectionhead"><h2>📋 点菜记录</h2></div>
    <div id="recordList"></div>
  </section>

  <section id="settingsSection" class="section">
    <div class="sectionhead"><h2>⚙️ 设置</h2></div>
    <div id="backupReminder"></div>
    <div class="card">
      <div class="card-title"><span class="ic">☁️</span><span class="txt">资料备份</span></div>
      <div class="foothint" id="lastBackupText">上次备份：还没有备份</div>
      <div class="settings-actions">
        <button class="setting-btn primary" onclick="exportData()">💾 导出我的资料</button>
        <button class="setting-btn" onclick="document.getElementById('importFile').click()">📂 导入我的资料</button>
        <input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importData(event)">
      </div>
      <div class="foothint">建议把导出的 JSON 文件保存到 iCloud Drive。换手机后打开同一个网页，再从这里导入即可。</div>
    </div>

    <div class="card">
      <div class="card-title"><span class="ic">🛠️</span><span class="txt">资料管理</span></div>
      <div class="settings-actions">
        <button class="setting-btn danger" onclick="confirmResetData()">🔄 恢复默认资料</button>
      </div>
      <div class="foothint">恢复默认资料会清除目前的食物、今日菜单和点菜记录。</div>
    </div>

    <div class="card">
      <div class="card-title"><span class="ic">🔐</span><span class="txt">App 密码</span></div>
      <div class="foothint" id="passwordStatus">目前未设置密码</div>
      <div class="settings-actions">
        <button class="setting-btn" onclick="openPasswordModal()">🔐 修改密码</button>
      </div>
    </div>
  </section>

</div>

<!-- 增加 / 编辑食物 -->
<div id="foodModal" class="modal">
  <div class="modal-sheet">
    <h2 id="foodModalTitle">＋ 增加食物</h2>
    <label>食物名称</label>
    <input id="foodName" type="text" placeholder="例如：鸡蛋全麦三明治">
    <div id="foodNameError" class="field-error">请输入食物名称</div>
    <label>分类（用于菜单筛选）</label>
    <select id="foodCategory">
      <option value="早餐">早餐</option>
      <option value="午餐/晚餐">午餐/晚餐</option>
    </select>
    <label>热量（可不填）</label>
    <input id="foodCalories" type="number" placeholder="例如：320">
    <div class="formsec-head">🥕 材料</div>
    <div id="ingrRows"></div>
    <button type="button" class="addrow-btn" onclick="addIngredientRow()">➕ 添加材料</button>

    <div class="formsec-head">👩‍🍳 做法</div>
    <div id="stepRows"></div>
    <button type="button" class="addrow-btn" onclick="addStepRow()">➕ 添加步骤</button>

    <label>食谱 LINK（可不填）</label>
    <input id="foodLink" type="url" placeholder="https://...">
    <div class="modal-actions">
      <button class="cancel-button" onclick="closeFoodModal()">取消</button>
      <button class="save-button" onclick="saveFood()">保存</button>
    </div>
  </div>
</div>

<!-- 食物详情 -->
<div id="detailModal" class="modal">
  <div class="modal-sheet">
    <button class="back-button" onclick="closeDetail()">← 返回</button>
    <div class="card" style="box-shadow:none;padding:0;background:transparent;">
      <div class="detail-hero">
        <h2 id="detailName"></h2>
        <div id="detailInfo" class="meta"></div>
      </div>

      <div class="detail-section">
        <div class="detail-title">🥕 材料</div>
        <div id="detailIngredients" class="detail-text"></div>
      </div>

      <div class="detail-section">
        <div class="detail-title">👩🏻‍🍳 做法</div>
        <div id="detailMethod" class="detail-text"></div>
      </div>

      <div class="detail-section">
        <div class="detail-title">🔗 食谱 LINK</div>
        <a id="detailLink" class="recipe-link" target="_blank" rel="noopener"></a>
      </div>

      <div class="action-row">
        <button class="edit-button" onclick="editFood()">✏️ 编辑</button>
        <button class="delete-button" onclick="deleteFood()">🗑️ 删除</button>
      </div>
      <div style="margin-top:12px;">
        <button id="detailPickButton" class="pillbtn" style="width:100%;" onclick="togglePickFromDetail()">我点 ❤️</button>
      </div>
    </div>
  </div>
</div>

<!-- 选择早/午/晚餐 -->
<div id="mealModal" class="modal">
  <div class="modal-sheet meal-sheet">
    <div class="meal-title">这次算哪一餐？</div>
    <div class="meal-options">
      <button class="meal-option" onclick="selectMeal('早餐')"><span class="ic">🥣</span>早餐</button>
      <button class="meal-option" onclick="selectMeal('午餐')"><span class="ic">🍱</span>午餐</button>
      <button class="meal-option" onclick="selectMeal('晚餐')"><span class="ic">🍲</span>晚餐</button>
    </div>
    <div class="modal-actions">
      <button class="cancel-button" onclick="closeMealModal()">取消</button>
    </div>
  </div>
</div>

<!-- 修改密码 -->
<div id="passwordModal" class="modal">
  <div class="modal-sheet confirm-sheet">
    <h2>🔐 修改密码</h2>
    <label>新密码</label>
    <input id="newPassword" type="password" inputmode="numeric" placeholder="请输入新密码">
    <label>再次输入</label>
    <input id="confirmPassword" type="password" inputmode="numeric" placeholder="再次输入新密码">
    <div id="passwordError" class="field-error">两次输入的密码不一致</div>
    <div class="modal-actions">
      <button class="cancel-button" onclick="closePasswordModal()">取消</button>
      <button class="save-button" onclick="savePassword()">保存</button>
    </div>
  </div>
</div>

<!-- 通用确认弹窗 -->
<div id="confirmModal" class="modal">
  <div class="modal-sheet confirm-sheet">
    <div id="confirmMsg" class="confirm-msg"></div>
    <div class="modal-actions">
      <button class="cancel-button" onclick="closeConfirm()">取消</button>
      <button class="save-button" onclick="runConfirm()">确定</button>
    </div>
  </div>
</div>

<script>
/* ========= 数据 =========
   orders 是唯一数据源：今日菜单 = 今天的 orders；点菜记录 = 所有 orders。
   取消/删除任何一条，两边都会同步消失。
*/
let foods = JSON.parse(localStorage.getItem("dietFoods") || "[]");
let orders = JSON.parse(localStorage.getItem("dietOrders") || migrateOldData());

function migrateOldData() {
  // 兼容旧版本数据（today+records 分开存的版本）
  try {
    const oldRecords = JSON.parse(localStorage.getItem("dietOrderRecords") || "[]");
    if (oldRecords.length) {
      return JSON.stringify(oldRecords.map(r => ({
        id: r.id, foodId: r.foodId, name: r.name, mealTime: r.category, date: r.date,
        ts: Date.parse(r.date + "T00:00:00") || Date.now()
      })));
    }
  } catch (e) {}
  return "[]";
}

let currentCategory = "全部";
let currentFoodId = null;
let pendingConfirmFn = null;
let pendingPickFoodId = null;
const CAT_ICON = { "早餐": "🥣", "午餐": "🍱", "晚餐": "🍲", "午餐/晚餐": "🍽️" };
const MEALS = ["早餐", "午餐", "晚餐"];
const ING_GROUPS = [
  { key: "主材料", icon: "🍖" },
  { key: "配料", icon: "🥬" },
  { key: "调味料", icon: "🧂" },
  { key: "酱汁", icon: "🥣" },
  { key: "其他", icon: "✨" }
];
let formIngredients = [];
let formSteps = [""];

/* 兼容旧数据：旧版 ingredients 是一整段文字，method 是一整段文字 */
function ingredientsToArray(food) {
  if (Array.isArray(food.ingredients)) {
    return food.ingredients.map(i => ({ name: i.name || i.text || "", amount: i.amount || "", group: i.group || "主材料" }));
  }
  if (typeof food.ingredients === "string" && food.ingredients.trim()) {
    return food.ingredients.split(/[,，、\n]+/).map(s => s.trim()).filter(Boolean).map(s => ({ name: s, amount: "", group: "主材料" }));
  }
  return [];
}
function stepsToArray(food) {
  if (Array.isArray(food.steps)) return food.steps.slice();
  if (typeof food.method === "string" && food.method.trim()) {
    return food.method.split(/\n+/).map(s => s.trim()).filter(Boolean);
  }
  return [];
}

/* ========= 日期 ========= */
function getToday() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function uid() {
  return Date.now().toString() + Math.random().toString(16).slice(2);
}

/* ========= 主标签切换 ========= */
function switchTab(tab) {
  document.querySelectorAll(".tabbar button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  document.getElementById("menuSection").classList.toggle("active", tab === "menu");
  document.getElementById("todaySection").classList.toggle("active", tab === "today");
  document.getElementById("recordSection").classList.toggle("active", tab === "record");
  document.getElementById("settingsSection").classList.toggle("active", tab === "settings");
  if (tab === "menu") renderFoods();
  if (tab === "today") renderTodayMenu();
  if (tab === "record") renderRecords();
  if (tab === "settings") renderSettings();
}

/* ========= 分类筛选（仅用于菜单浏览） ========= */
function changeCategory(category) {
  currentCategory = category;
  document.querySelectorAll(".subtab").forEach(btn => btn.classList.toggle("active", btn.dataset.category === category));
  renderFoods();
}

/* ========= 找某食物今天的点菜记录 ========= */
function findTodayOrder(foodId) {
  const today = getToday();
  return orders.find(o => o.foodId === foodId && o.date === today);
}

/* ========= 显示食物列表 ========= */
function renderFoods() {
  const list = document.getElementById("foodList");
  const filtered = currentCategory === "全部"
    ? foods
    : currentCategory === "午餐/晚餐"
      ? foods.filter(f => ["午餐","晚餐","午餐/晚餐"].includes(f.category))
      : foods.filter(f => f.category === currentCategory);

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty">这里还没有食物<br><br>点击「＋ 增加食物」开始添加 ❤️</div>`;
    return;
  }

  list.innerHTML = filtered.map(food => {
    const picked = findTodayOrder(food.id);
    const linkMeta = food.link ? `<div class="meta"><span class="dot link">🔗</span>食谱链接</div>` : "";
    const banner = picked ? `<div class="statusbar">✅ 已加入今日菜单 · ${escapeHTML(picked.mealTime)}</div>` : "";
    return `
      <div class="card" onclick="openFoodDetail('${food.id}')">
        <div class="card-head">
          <div class="card-title"><span class="ic">${CAT_ICON[food.category] || "🍽️"}</span><span class="txt">${escapeHTML(food.name)}</span></div>
          <button class="pickpill ${picked ? "picked" : ""}" onclick="event.stopPropagation(); togglePick('${food.id}');">
            ${picked ? "✓ " + escapeHTML(picked.mealTime) : "我点"}
          </button>
        </div>
        <div class="meta"><span class="dot cat">🏷️</span>${escapeHTML(food.category)}</div>
        ${linkMeta}
        <div class="foothint">点击查看详情 →</div>
      </div>
      ${banner}
    `;
  }).join("");
}

/* ========= 我点 / 取消 ========= */
function togglePick(foodId) {
  const existing = findTodayOrder(foodId);
  if (existing) {
    orders = orders.filter(o => o.id !== existing.id);
    saveData();
    refreshAllViews();
  } else {
    openMealModal(foodId);
  }
}

function togglePickFromDetail() {
  if (!currentFoodId) return;
  togglePick(currentFoodId);
}

function openMealModal(foodId) {
  pendingPickFoodId = foodId;
  document.getElementById("mealModal").classList.add("show");
}
function closeMealModal() {
  pendingPickFoodId = null;
  document.getElementById("mealModal").classList.remove("show");
}
function selectMeal(mealTime) {
  const food = foods.find(f => f.id === pendingPickFoodId);
  closeMealModal();
  if (!food) return;
  orders.push({
    id: uid(),
    foodId: food.id,
    name: food.name,
    mealTime: mealTime,
    date: getToday(),
    ts: Date.now()
  });
  saveData();
  refreshAllViews();
}

function refreshAllViews() {
  if (document.getElementById("menuSection").classList.contains("active")) renderFoods();
  if (document.getElementById("todaySection").classList.contains("active")) renderTodayMenu();
  if (document.getElementById("recordSection").classList.contains("active")) renderRecords();
  updateDetailPickButton();
}

function updateDetailPickButton() {
  const btn = document.getElementById("detailPickButton");
  if (!btn || !currentFoodId) return;
  const picked = findTodayOrder(currentFoodId);
  btn.textContent = picked ? `✓ 已加入今日菜单 · ${picked.mealTime}` : "我点 ❤️";
}

/* ========= 今日菜单（按点菜时选的早/午/晚分组，不是食物分类） ========= */
function renderTodayMenu() {
  const list = document.getElementById("todayList");
  const today = getToday();
  const todays = orders.filter(o => o.date === today);
  let html = `<div class="card">`;

  MEALS.forEach(meal => {
    const items = todays.filter(o => o.mealTime === meal);
    html += `<div class="group"><h3 class="groupname">${CAT_ICON[meal]} ${meal}</h3>`;
    if (items.length === 0) {
      html += `<div class="empty" style="padding:10px 0;">今天还没有选择</div>`;
    } else {
      items.forEach(item => {
        html += `
          <div class="record-item">
            <div class="rtxt">${escapeHTML(item.name)}</div>
            <button class="cancel-pick" onclick="cancelOrder('${item.id}')">取消</button>
          </div>
        `;
      });
    }
    html += `</div>`;
  });

  html += `</div>`;
  list.innerHTML = html;
}

/* ========= 点菜记录（按日期分组，再按早/午/晚分组） ========= */
function renderRecords() {
  const list = document.getElementById("recordList");

  if (orders.length === 0) {
    list.innerHTML = `<div class="empty">还没有点菜记录</div>`;
    return;
  }

  const byDate = {};
  orders.forEach(o => { (byDate[o.date] = byDate[o.date] || []).push(o); });
  const dates = Object.keys(byDate).sort().reverse();

  let html = "";
  dates.forEach(date => {
    html += `<div class="card"><div class="datehead">📅 ${date}</div>`;
    MEALS.forEach(meal => {
      const items = byDate[date].filter(o => o.mealTime === meal).sort((a,b) => b.ts - a.ts);
      if (items.length === 0) return;
      items.forEach(item => {
        html += `
          <div class="record-item">
            <div class="rtxt">${CAT_ICON[meal]} ${escapeHTML(meal)} · ${escapeHTML(item.name)}</div>
            <button class="delete-record" onclick="deleteRecord('${item.id}')">删除</button>
          </div>
        `;
      });
    });
    html += `</div>`;
  });

  list.innerHTML = html;
}

/* ========= 取消 / 删除（统一操作同一份 orders，今日菜单和点菜记录会同步） ========= */
function cancelOrder(orderId) {
  orders = orders.filter(o => o.id !== orderId);
  saveData();
  refreshAllViews();
}

function deleteRecord(recordId) {
  showConfirm("确定要删除这条点菜记录吗？（今日菜单里对应的这条也会一起消失，不会删除这道食谱）", () => {
    orders = orders.filter(o => o.id !== recordId);
    saveData();
    refreshAllViews();
  });
}

/* ========= 材料行 ========= */
function renderIngrRows() {
  const wrap = document.getElementById("ingrRows");
  wrap.innerHTML = formIngredients.map((ing, idx) => `
    <div class="ingr-row">
      <input class="iname" type="text" placeholder="材料，例如：三文鱼" value="${escapeHTML(ing.name)}" oninput="updateIngr(${idx},'name',this.value)">
      <input class="iamount" type="text" placeholder="分量，例如：2片" value="${escapeHTML(ing.amount)}" oninput="updateIngr(${idx},'amount',this.value)">
      <select class="igroup" onchange="updateIngr(${idx},'group',this.value)">
        ${ING_GROUPS.map(g => `<option value="${g.key}" ${ing.group === g.key ? "selected" : ""}>${g.icon} ${g.key}</option>`).join("")}
      </select>
      <button type="button" class="rowdel" onclick="removeIngrRow(${idx})">🗑️</button>
    </div>
  `).join("");
}
function addIngredientRow() {
  formIngredients.push({ name: "", amount: "", group: "主材料" });
  renderIngrRows();
}
function updateIngr(idx, field, value) {
  if (formIngredients[idx]) formIngredients[idx][field] = value;
}
function removeIngrRow(idx) {
  formIngredients.splice(idx, 1);
  renderIngrRows();
}

/* ========= 做法行 ========= */
function renderStepRows() {
  const wrap = document.getElementById("stepRows");
  wrap.innerHTML = formSteps.map((s, idx) => `
    <div class="step-row">
      <div class="stepnum">${idx + 1}</div>
      <textarea placeholder="请输入第${idx === 0 ? "一" : (idx + 1)}个步骤……" oninput="updateStep(${idx},this.value)">${escapeHTML(s)}</textarea>
      ${formSteps.length > 1 ? `<button type="button" class="rowdel" onclick="removeStepRow(${idx})">🗑️</button>` : ""}
    </div>
  `).join("");
}
function addStepRow() {
  formSteps.push("");
  renderStepRows();
}
function updateStep(idx, value) {
  formSteps[idx] = value;
}
function removeStepRow(idx) {
  if (formSteps.length <= 1) return;
  formSteps.splice(idx, 1);
  renderStepRows();
}

/* ========= 增加食物 ========= */
function openAddFood() {
  currentFoodId = null;
  document.getElementById("foodModalTitle").textContent = "＋ 增加食物";
  clearFoodForm();
  document.getElementById("foodModal").classList.add("show");
}

function clearFoodForm() {
  document.getElementById("foodName").value = "";
  document.getElementById("foodCategory").value = "早餐";
  document.getElementById("foodCalories").value = "";
  document.getElementById("foodLink").value = "";
  document.getElementById("foodNameError").style.display = "none";
  formIngredients = [{ name: "", amount: "", group: "主材料" }];
  formSteps = [""];
  renderIngrRows();
  renderStepRows();
}

/* ========= 保存食物 ========= */
function saveFood() {
  const nameInput = document.getElementById("foodName");
  const name = nameInput.value.trim();
  const errorEl = document.getElementById("foodNameError");

  if (!name) {
    errorEl.style.display = "block";
    nameInput.focus();
    return;
  }
  errorEl.style.display = "none";

  const food = {
    id: currentFoodId || uid(),
    name: name,
    category: document.getElementById("foodCategory").value,
    calories: document.getElementById("foodCalories").value.trim(),
    ingredients: formIngredients
      .filter(i => i.name.trim())
      .map(i => ({ name: i.name.trim(), amount: i.amount.trim(), group: i.group })),
    steps: formSteps.map(s => s.trim()).filter(Boolean),
    link: document.getElementById("foodLink").value.trim()
  };

  if (currentFoodId) {
    const index = foods.findIndex(f => f.id === currentFoodId);
    if (index !== -1) foods[index] = food;
  } else {
    foods.push(food);
  }

  saveData();
  closeFoodModal();
  renderFoods();
}

/* ========= 食物详情 ========= */
function openFoodDetail(foodId) {
  currentFoodId = foodId;
  const food = foods.find(f => f.id === foodId);
  if (!food) return;

  document.getElementById("detailName").textContent = food.name;
  document.getElementById("detailInfo").innerHTML =
    `<span class="dot cat">🏷️</span>` + escapeHTML(food.category) +
    (food.calories ? ` · 🔥 ${escapeHTML(food.calories)} kcal` : "");
  document.getElementById("detailIngredients").innerHTML = renderDetailIngredients(food);
  document.getElementById("detailMethod").innerHTML = renderDetailSteps(food);

  const link = document.getElementById("detailLink");
  if (food.link) {
    link.textContent = food.link;
    link.href = food.link;
    link.style.pointerEvents = "auto";
  } else {
    link.textContent = "没有填写";
    link.removeAttribute("href");
    link.style.pointerEvents = "none";
  }

  updateDetailPickButton();
  document.getElementById("detailModal").classList.add("show");
}

/* ========= 详情页：材料 / 做法 展示 ========= */
function renderDetailIngredients(food) {
  const arr = ingredientsToArray(food);
  if (arr.length === 0) return "没有填写";
  const groups = {};
  arr.forEach(i => { const g = i.group || "其他"; (groups[g] = groups[g] || []).push(i); });
  let html = "";
  ING_GROUPS.forEach(g => {
    const items = groups[g.key];
    if (!items || items.length === 0) return;
    html += `<div style="margin-bottom:12px;"><div style="font-size:12px;color:var(--ink-faint);margin-bottom:5px;">${g.icon} ${g.key}</div>`;
    items.forEach(i => {
      html += `<div style="padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px;">${escapeHTML(i.name)}${i.amount ? "　·　" + escapeHTML(i.amount) : ""}</div>`;
    });
    html += `</div>`;
  });
  return html || "没有填写";
}
function renderDetailSteps(food) {
  const arr = stepsToArray(food).filter(s => s && s.trim());
  if (arr.length === 0) return "没有填写";
  return `<ol style="margin:0;padding-left:20px;">` +
    arr.map(s => `<li style="margin-bottom:9px;line-height:1.65;">${escapeHTML(s)}</li>`).join("") +
    `</ol>`;
}

/* ========= 编辑 ========= */
function editFood() {
  const food = foods.find(f => f.id === currentFoodId);
  if (!food) return;

  closeDetail();
  document.getElementById("foodModalTitle").textContent = "✏️ 编辑食物";
  document.getElementById("foodName").value = food.name;
  document.getElementById("foodCategory").value = food.category;
  document.getElementById("foodCalories").value = food.calories || "";
  document.getElementById("foodLink").value = food.link || "";
  document.getElementById("foodNameError").style.display = "none";
  formIngredients = ingredientsToArray(food);
  if (formIngredients.length === 0) formIngredients = [{ name: "", amount: "", group: "主材料" }];
  formSteps = stepsToArray(food);
  if (formSteps.length === 0) formSteps = [""];
  renderIngrRows();
  renderStepRows();
  document.getElementById("foodModal").classList.add("show");
}

/* ========= 删除食物 ========= */
function deleteFood() {
  const food = foods.find(f => f.id === currentFoodId);
  if (!food) return;
  showConfirm(`确定要删除「${food.name}」吗？此操作无法撤销。`, () => {
    foods = foods.filter(f => f.id !== currentFoodId);
    saveData();
    closeDetail();
    renderFoods();
  });
}

/* ========= 关闭弹窗 ========= */
function closeFoodModal() { document.getElementById("foodModal").classList.remove("show"); }
function closeDetail() { document.getElementById("detailModal").classList.remove("show"); }

/* ========= 通用确认弹窗（不用浏览器自带 confirm，避免被拦截不弹出） ========= */
function showConfirm(message, onYes) {
  pendingConfirmFn = onYes;
  document.getElementById("confirmMsg").textContent = message;
  document.getElementById("confirmModal").classList.add("show");
}
function closeConfirm() {
  pendingConfirmFn = null;
  document.getElementById("confirmModal").classList.remove("show");
}
function runConfirm() {
  const fn = pendingConfirmFn;
  closeConfirm();
  if (fn) fn();
}

/* ========= 设置 / 备份 ========= */
function renderSettings() {
  const last = localStorage.getItem("dietLastBackup");
  const text = document.getElementById("lastBackupText");
  const reminder = document.getElementById("backupReminder");
  const pwdStatus = document.getElementById("passwordStatus");

  text.textContent = last ? `上次备份：${last}` : "上次备份：还没有备份";
  pwdStatus.textContent = localStorage.getItem("dietAppPassword") ? "已设置密码" : "目前未设置密码";

  let needBackup = !last;
  if (last) {
    const lastDate = new Date(last + "T00:00:00");
    const days = Math.floor((new Date() - lastDate) / 86400000);
    needBackup = days >= 30;
  }
  reminder.innerHTML = needBackup
    ? `<div class="backup-alert">💡 ${last ? "距离上次备份已经超过 30 天，建议现在备份一次。" : "你还没有备份过资料，建议导出一份保存到 iCloud Drive。"}</div>`
    : "";
}

function exportData() {
  const today = getToday();
  const data = {
    app: "我的一日三餐",
    version: 1,
    exportedAt: new Date().toISOString(),
    foods: foods,
    orders: orders
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `我的一日三餐_备份_${today}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  localStorage.setItem("dietLastBackup", today);
  renderSettings();
}

function importData(event) {
  const file = event.target.files && event.target.files[0];
  event.target.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function() {
    try {
      const data = JSON.parse(reader.result);
      if (!data || !Array.isArray(data.foods) || !Array.isArray(data.orders)) {
        throw new Error("invalid");
      }
      showConfirm("确定要导入这份备份吗？目前的资料会被备份文件取代。", () => {
        foods = data.foods;
        orders = data.orders;
        saveData();
        refreshAllViews();
        renderSettings();
        alert("资料已成功导入。");
      });
    } catch(e) {
      alert("这个备份文件无法读取，请选择由本 App 导出的 JSON 备份文件。");
    }
  };
  reader.readAsText(file);
}

function confirmResetData() {
  showConfirm("确定要恢复默认资料吗？目前所有食物、今日菜单和点菜记录都会被清除。建议先导出备份。", () => {
    foods = [];
    orders = [];
    localStorage.removeItem("dietFoods");
    localStorage.removeItem("dietOrders");
    saveData();
    refreshAllViews();
    renderSettings();
  });
}

function openPasswordModal() {
  document.getElementById("newPassword").value = "";
  document.getElementById("confirmPassword").value = "";
  document.getElementById("passwordError").style.display = "none";
  document.getElementById("passwordModal").classList.add("show");
}
function closePasswordModal() {
  document.getElementById("passwordModal").classList.remove("show");
}
function savePassword() {
  const p1 = document.getElementById("newPassword").value;
  const p2 = document.getElementById("confirmPassword").value;
  const err = document.getElementById("passwordError");
  if (!p1) {
    err.textContent = "请输入新密码";
    err.style.display = "block";
    return;
  }
  if (p1 !== p2) {
    err.textContent = "两次输入的密码不一致";
    err.style.display = "block";
    return;
  }
  localStorage.setItem("dietAppPassword", p1);
  closePasswordModal();
  renderSettings();
}

/* ========= 保存到本地 ========= */
function saveData() {
  localStorage.setItem("dietFoods", JSON.stringify(foods));
  localStorage.setItem("dietOrders", JSON.stringify(orders));
}

/* ========= 防止 HTML 注入 ========= */
function escapeHTML(text) {
  return String(text || "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

/* ========= 启动 ========= */
saveData();
renderFoods();
</script>

</body>
</html>
