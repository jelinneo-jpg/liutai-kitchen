<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>我的一日三餐</title><style>
:root{--bg:#FBF1E7;--card-bg:#FFFFFF;--ink:#2A2620;--ink-soft:#6B6660;--ink-faint:#9C968C;--line:#F0E4D6;--accent:#E08A5B;--accent-ink:#FFFFFF;--accent-soft:#FBE3D2;--purple:#8B7FD1;--green-bg:#E3F5EA;--green-ink:#2F9E5B;--danger-bg:#FBE4E2;--danger-ink:#C4544A;--input-bg:#FFFFFF;--input-line:#E9DACB;--sheet-bg:#FBF1E7;--shadow:0 8px 22px rgba(60,45,25,.08);color-scheme:light}
:root:not([data-theme="light"]){@media(prefers-color-scheme:dark){:root{--bg:#221C15;--card-bg:#2B2419;--ink:#F1E7D8;--ink-soft:#C7B79D;--ink-faint:#8B7C64;--line:#40331F;--accent:#E4966A;--accent-ink:#221C15;--accent-soft:#3C2C1C;--purple:#A79BE0;--green-bg:#233A28;--green-ink:#6BC98D;--danger-bg:#3C2621;--danger-ink:#E2867B;--input-bg:#2B2419;--input-line:#40331F;--sheet-bg:#221C15;--shadow:0 8px 22px rgba(0,0,0,.35)}}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}button{font-family:inherit;cursor:pointer}#app{max-width:680px;margin:0 auto;padding:20px 16px 48px}header.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}header.top .emoji{font-size:26px}header.top h1{font-size:23px;margin:0;font-weight:800}header.top .sub{font-size:12.5px;color:var(--ink-faint);margin-top:2px}.tabbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:20px}.tabbar::-webkit-scrollbar{display:none}.tabbar button{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:11px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card-bg);color:var(--ink-soft);font-size:13.5px;font-weight:600;box-shadow:var(--shadow)}.tabbar button.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.section{display:none}.section.active{display:block}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.sectionhead h2{font-size:17px;margin:0}.pillbtn{border:0;background:var(--accent);color:var(--accent-ink);padding:10px 15px;border-radius:12px;font-size:13px;font-weight:700}.subtabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px}.subtab{flex:0 0 auto;padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:var(--card-bg);color:var(--ink-soft);font-size:13px}.subtab.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}.card{background:var(--card-bg);border-radius:18px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow)}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.card-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;min-width:0}.card-title .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-soft);margin-top:6px}.dot{width:20px;height:20px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px}.dot.cat{background:var(--accent-soft);color:var(--accent)}.foothint{font-size:12px;color:var(--ink-faint);margin-top:10px}.pickpill{border:0;border-radius:10px;padding:8px 12px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:700}.pickpill.picked{background:var(--accent);color:var(--accent-ink)}.statusbar{background:var(--green-bg);color:var(--green-ink);text-align:center;border-radius:12px;padding:9px;font-size:12.5px;font-weight:700;margin:-4px 0 12px}.empty{text-align:center;color:var(--ink-faint);padding:40px 20px;line-height:1.8;font-size:13.5px}.record-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}.record-item:last-child{border-bottom:none}.rtxt{font-size:14.5px}.cal{font-size:12.5px;color:var(--accent);margin-top:3px;font-weight:700}.cancel-pick,.delete-record{border:0;border-radius:9px;padding:6px 11px;background:var(--danger-bg);color:var(--danger-ink);font-size:12px}.groupname{font-size:13px;color:var(--ink-soft);margin:0 0 6px}.group{margin-bottom:14px}.datehead{font-size:13.5px;font-weight:700;color:var(--ink-soft);margin:0 0 8px}.cal-summary{background:linear-gradient(135deg,var(--accent-soft),var(--card-bg));border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}.cal-summary .label{font-size:13px;color:var(--ink-soft)}.cal-summary .value{font-size:22px;font-weight:800;color:var(--accent)}.modal{position:fixed;inset:0;background:rgba(30,20,10,.42);display:none;align-items:flex-end;z-index:30}.modal.show{display:flex}.modal-sheet{width:100%;max-width:680px;margin:auto;background:var(--sheet-bg);border-radius:22px 22px 0 0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto}.meal-sheet,.confirm-sheet{max-width:400px;border-radius:18px}.modal-sheet h2{margin-top:0;font-size:18px}label{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:8px}input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--input-line);border-radius:12px;margin:6px 0 12px;background:var(--input-bg);color:var(--ink);font-size:14.5px;font-family:inherit}.field-error{color:var(--danger-ink);font-size:12.5px;margin:-8px 0 10px;display:none}.modal-actions{display:flex;gap:8px}.modal-actions button{flex:1;padding:11px;border-radius:12px;font-size:14px;font-weight:600}.cancel-button{background:var(--card-bg);border:1px solid var(--line);color:var(--ink-soft)}.save-button{background:var(--accent);color:var(--accent-ink);border:0}.meal-options{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}.meal-option{padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card-bg);color:var(--ink);font-size:15px;font-weight:600;text-align:left}.formsec-head{font-size:14px;font-weight:700;margin:18px 0 10px}.ingr-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}.ingr-row input,.ingr-row select{margin:0}.iname{flex:1 1 120px}.iamount{flex:1 1 90px}.igroup{flex:0 0 128px}.rowdel{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--line);color:var(--ink-soft)}.step-row{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}.stepnum{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:8px}.step-row textarea{flex:1;margin:0}.addrow-btn{width:100%;padding:12px;border-radius:12px;border:1.5px dashed var(--accent);background:transparent;color:var(--accent);font-size:13.5px;font-weight:600;margin-bottom:18px}.settings-actions{display:grid;gap:9px;margin-top:14px}.setting-btn{width:100%;border:1px solid var(--line);background:var(--card-bg);color:var(--ink);padding:12px 14px;border-radius:12px;font-size:14px;font-weight:700;text-align:left}.setting-btn.primary{background:var(--accent);color:var(--accent-ink)}.setting-btn.danger{background:var(--danger-bg);color:var(--danger-ink)}.detail-section{background:var(--card-bg);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-top:10px}.action-row{display:flex;gap:8px;margin-top:16px}.action-row button{flex:1;padding:11px;border-radius:12px}.back-button{border:1px solid var(--line);background:var(--card-bg);color:var(--ink-soft);border-radius:12px;padding:9px 14px;margin-bottom:14px}.delete-button{background:var(--danger-bg);border:0;color:var(--danger-ink)}.edit-button{background:var(--card-bg);border:1px solid var(--line);color:var(--ink-soft)}

.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}.choice{padding:12px 6px;border:1px solid var(--line);border-radius:12px;background:var(--card-bg);color:var(--ink);font-weight:650}.choice.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}.search{margin-bottom:10px}.result-card{padding:12px;border:1px solid var(--line);border-radius:14px;margin:7px 0;background:var(--card-bg)}.result-card button{float:right}.mini{font-size:12px;color:var(--ink-faint);margin-top:3px}
</style></head><body><div id="app">
<header class="top"><div class="emoji">🥗</div><div><h1>我的一日三餐</h1><div class="sub">点菜 · 今日菜单 · 点菜记录</div></div></header>
<nav class="tabbar"><button data-tab="order" class="active" onclick="switchTab('order')">🍽️ 点菜</button><button data-tab="today" onclick="switchTab('today')">📅 今日菜单</button><button data-tab="record" onclick="switchTab('record')">📋 点菜记录</button><button data-tab="settings" onclick="switchTab('settings')">⚙️ 设置</button></nav>
<section id="orderSection" class="section active"><div class="sectionhead"><h2>🍽️ 今天吃什么？</h2></div><div class="card"><div class="card-title">快速点菜</div><div class="foothint">不用先保存食物。选食物、份量和做法后，直接加入今日菜单。</div><button class="pillbtn" style="width:100%;margin-top:14px" onclick="openOrder()">＋ 开始点菜</button></div></section>
<section id="todaySection" class="section"><div class="sectionhead"><h2>📅 今日菜单</h2></div><div id="todayList"></div></section>
<section id="recordSection" class="section"><div class="sectionhead"><h2>📋 点菜记录</h2></div><div id="recordList"></div></section>
<section id="settingsSection" class="section"><div class="sectionhead"><h2>⚙️ 设置</h2></div><div class="card"><div class="card-title">☁️ 资料备份</div><div class="settings-actions"><button class="setting-btn primary" onclick="exportData()">💾 导出我的资料</button><button class="setting-btn" onclick="document.getElementById('importFile').click()">📂 导入我的资料</button><input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)"></div></div><div class="card"><button class="setting-btn danger" onclick="confirmResetData()">🔄 清除点菜记录</button></div></section></div>
<div id="orderModal" class="modal"><div class="modal-sheet"><button class="back-button" onclick="closeOrder()">← 返回</button><h2>🍽️ 点菜</h2><label>1. 食物类别</label><div id="catGrid" class="choice-grid"></div><label>2. 找食物</label><input id="foodSearch" class="search" placeholder="例如：三文鱼、白饭、豆腐" oninput="renderFoodChoices()"><div id="foodChoices"></div><div id="pickedBox" style="display:none"><div class="formsec-head">已选：<span id="pickedName"></span></div><label>3. 份量</label><div id="portionGrid" class="choice-grid"></div><label>自定义重量 g（可不填）</label><input id="customGram" type="number" min="1" inputmode="decimal" placeholder="例如：150" oninput="updateEstimate()"><label>4. 做法</label><div id="cookGrid" class="choice-grid"></div><label>5. 哪一餐？</label><div id="mealGrid" class="choice-grid"></div><div id="breakfastExtras" style="display:none"><label>6. 加料（可不加）</label><div id="addonGrid" class="choice-grid"></div><label>7. 抹酱（可不加）</label><div id="spreadGrid" class="choice-grid"></div></div><div class="cal-summary"><div><div class="label">🔥 估算热量</div><div id="estDetail" class="foothint"></div></div><div id="estValue" class="value">0 kcal</div></div><div class="foothint">热量为日常记录估算值；实际会因油、酱汁和食材大小不同而变化。</div><div class="modal-actions" style="margin-top:14px"><button class="cancel-button" onclick="closeOrder()">取消</button><button class="save-button" onclick="addToToday()">加入今日菜单</button></div></div></div></div>
<div id="calorieModal" class="modal"><div class="modal-sheet confirm-sheet"><h2>🔥 修改卡路里</h2><div id="calorieFoodName" style="font-weight:700;margin-bottom:10px"></div><label>这次实际吃的卡路里 kcal</label><input id="editOrderCalories" type="number" min="0" inputmode="decimal"><input id="editOrderId" type="hidden"><div class="modal-actions"><button class="cancel-button" onclick="closeCalorieModal()">取消</button><button class="save-button" onclick="saveOrderCalories()">保存</button></div></div></div>
<div id="confirmModal" class="modal"><div class="modal-sheet confirm-sheet"><div id="confirmMsg" style="margin-bottom:18px"></div><div class="modal-actions"><button class="cancel-button" onclick="closeConfirm()">取消</button><button class="save-button" onclick="runConfirm()">确定</button></div></div></div>
<script>
let orders=JSON.parse(localStorage.getItem('dietOrders')||'[]'),pendingConfirmFn=null;
const CAT_ICON={'早餐':'🥣','午餐':'🍱','晚餐':'🍲'},MEALS=['早餐','午餐','晚餐'];
const DB=[
['早餐','白吐司',265],['早餐','全麦吐司',250],['早餐','小餐包',300],['早餐','可颂',406],['早餐','燕麦',380],['早餐','水煮蛋',143],['早餐','牛奶',61],['早餐','无糖豆浆',33],['早餐','优格',70],
['主食','白饭',130],['主食','粥',55],['主食','炒饭',180],['主食','燕麦',70],['主食','面包',265],['主食','马铃薯',77],['主食','番薯',86],
['肉类','鸡胸肉',165],['肉类','鸡腿肉',210],['肉类','猪瘦肉',200],['肉类','五花肉',500],['肉类','牛肉',250],
['鱼类','三文鱼',208],['鱼类','鲈鱼',125],['鱼类','鳕鱼',105],['鱼类','石斑鱼',120],['鱼类','鲳鱼',145],['鱼类','马鲛鱼',205],['鱼类','罗非鱼',128],['鱼类','其他白肉鱼',125],
['海鲜','虾',100],['海鲜','鱿鱼',92],['海鲜','蛤蜊',75],['海鲜','扇贝',90],
['蛋/豆腐','鸡蛋',143],['蛋/豆腐','豆腐',85],['蛋/豆腐','豆干',150],
['蔬菜','青菜',25],['蔬菜','西兰花',35],['蔬菜','番茄',18],['蔬菜','蘑菇',25],
['面类','黄面',150],['面类','米粉',110],['面类','意大利面',158],['面类','乌冬面',130]
];
const CATS=[['早餐','🥣'],['主食','🍚'],['肉类','🥩'],['鱼类','🐟'],['海鲜','🦐'],['蛋/豆腐','🥚'],['蔬菜','🥬'],['面类','🍜']];
const PORTIONS=[['少量',70],['半碗/半份',100],['1碗/1份',150],['大份',200],['2份',300]];
const COOKS=[['蒸/煮',0],['清汤',10],['煎',60],['炒',90],['炸',180],['烤',30]];
const ADDONS=[['不加',0],['Ham 火腿 1片',35],['Ham 火腿 2片',70],['鸡蛋 1粒',70],['芝士 1片',60],['Tuna 金枪鱼',70]];
const SPREADS=[['不加',0],['牛油 少量',35],['牛油 普通',70],['Kaya 少量',30],['Kaya 普通',60],['花生酱 少量',45],['花生酱 普通',90],['果酱 普通',50],['Nutella 普通',80],['Mayonnaise 普通',90]];
let selCat='早餐',selFood=null,selGram=100,selCook=0,selCookName='蒸/煮',selMeal='早餐',selAddon=0,selAddonName='不加',selSpread=0,selSpreadName='不加';
function uid(){return Date.now().toString()+Math.random().toString(16).slice(2)} function getToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`} function esc(t){return String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))} function numCal(v){const n=Number(v);return Number.isFinite(n)&&n>=0?n:0} function totalCal(a){return a.reduce((s,o)=>s+numCal(o.calories),0)}
function saveData(){localStorage.setItem('dietOrders',JSON.stringify(orders))}
function switchTab(tab){document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));['order','today','record','settings'].forEach(x=>document.getElementById(x+'Section').classList.toggle('active',x===tab));if(tab==='today')renderTodayMenu();if(tab==='record')renderRecords()}
function openOrder(){selFood=null;selCat='早餐';selGram=100;selCook=0;selCookName='蒸/煮';selMeal='早餐';selAddon=0;selAddonName='不加';selSpread=0;selSpreadName='不加';document.getElementById('foodSearch').value='';document.getElementById('customGram').value='';document.getElementById('pickedBox').style.display='none';renderCats();renderFoodChoices();document.getElementById('orderModal').classList.add('show')} function closeOrder(){document.getElementById('orderModal').classList.remove('show')}
function renderCats(){document.getElementById('catGrid').innerHTML=CATS.map(x=>`<button class="choice ${selCat===x[0]?'active':''}" onclick="selCat='${x[0]}';renderCats();renderFoodChoices()">${x[1]} ${x[0]}</button>`).join('')}
function renderFoodChoices(){const q=document.getElementById('foodSearch').value.trim().toLowerCase();let a=DB.filter(x=>q?x[1].toLowerCase().includes(q):x[0]===selCat);document.getElementById('foodChoices').innerHTML=a.map((x,i)=>`<div class="result-card"><button class="pickpill" onclick="pickFood('${x[1]}')">选择</button><b>${esc(x[1])}</b><div class="mini">约 ${x[2]} kcal / 100g</div></div>`).join('')||'<div class="empty" style="padding:15px">找不到这个食物</div>'}
function pickFood(name){selFood=DB.find(x=>x[1]===name);document.getElementById('pickedName').textContent=name;document.getElementById('pickedBox').style.display='block';renderPortions();renderCooks();renderMeals();renderBreakfastExtras();updateEstimate()}
function renderPortions(){document.getElementById('portionGrid').innerHTML=PORTIONS.map(x=>`<button class="choice ${selGram===x[1]&&!document.getElementById('customGram').value?'active':''}" onclick="selGram=${x[1]};document.getElementById('customGram').value='';renderPortions();updateEstimate()">${x[0]}<div class="mini">约${x[1]}g</div></button>`).join('')}
function renderCooks(){document.getElementById('cookGrid').innerHTML=COOKS.map(x=>`<button class="choice ${selCookName===x[0]?'active':''}" onclick="selCookName='${x[0]}';selCook=${x[1]};renderCooks();updateEstimate()">${x[0]}</button>`).join('')}
function renderMeals(){document.getElementById('mealGrid').innerHTML=MEALS.map(x=>`<button class="choice ${selMeal===x?'active':''}" onclick="selMeal='${x}';renderMeals()">${CAT_ICON[x]} ${x}</button>`).join('')}
function renderBreakfastExtras(){const box=document.getElementById('breakfastExtras');const show=selFood&&selFood[0]==='早餐'&&['白吐司','全麦吐司','小餐包','可颂'].includes(selFood[1]);box.style.display=show?'block':'none';if(!show){selAddon=0;selAddonName='不加';selSpread=0;selSpreadName='不加';return}document.getElementById('addonGrid').innerHTML=ADDONS.map(x=>`<button class="choice ${selAddonName===x[0]?'active':''}" onclick="selAddonName='${x[0]}';selAddon=${x[1]};renderBreakfastExtras();updateEstimate()">${x[0]}</button>`).join('');document.getElementById('spreadGrid').innerHTML=SPREADS.map(x=>`<button class="choice ${selSpreadName===x[0]?'active':''}" onclick="selSpreadName='${x[0]}';selSpread=${x[1]};renderBreakfastExtras();updateEstimate()">${x[0]}</button>`).join('')}
function updateEstimate(){if(!selFood)return;const custom=Number(document.getElementById('customGram').value);const g=custom>0?custom:selGram;const kcal=Math.round(selFood[2]*g/100+selCook+selAddon+selSpread);document.getElementById('estValue').textContent=kcal+' kcal';const extras=[selAddonName!=='不加'?selAddonName:'',selSpreadName!=='不加'?selSpreadName:''].filter(Boolean).join(' · ');document.getElementById('estDetail').textContent=`${g}g · ${selCookName}${extras?' · '+extras:''} · 约 ${kcal} kcal`;if(custom>0)renderPortions()}
function addToToday(){if(!selFood)return;const custom=Number(document.getElementById('customGram').value);const g=custom>0?custom:selGram,kcal=Math.round(selFood[2]*g/100+selCook+selAddon+selSpread);const extras=[selAddonName!=='不加'?selAddonName:'',selSpreadName!=='不加'?selSpreadName:''].filter(Boolean).join(' · ');orders.push({id:uid(),name:selFood[1],mealTime:selMeal,date:getToday(),ts:Date.now(),calories:kcal,portion:g+'g',cook:selCookName,extras});saveData();closeOrder();switchTab('today')}
function renderTodayMenu(){const t=orders.filter(o=>o.date===getToday());let h=`<div class="cal-summary"><div><div class="label">🔥 今日总卡路里</div><div class="foothint">按点菜估算自动统计</div></div><div class="value">${Math.round(totalCal(t))} kcal</div></div><div class="card">`;MEALS.forEach(m=>{const a=t.filter(o=>o.mealTime===m);h+=`<div class="group"><h3 class="groupname">${CAT_ICON[m]} ${m}</h3>`;h+=a.length?a.map(i=>`<div class="record-item"><div><div class="rtxt">${esc(i.name)}</div><div class="mini">${esc(i.portion||'')}${i.cook?' · '+esc(i.cook):''}${i.extras?' · '+esc(i.extras):''}</div><div class="cal">🔥 ${esc(i.calories)} kcal</div></div><div style="display:flex;gap:6px"><button class="pickpill" onclick="openCalorieEditor('${i.id}')">🔥 修改</button><button class="cancel-pick" onclick="cancelOrder('${i.id}')">取消</button></div></div>`).join(''):'<div class="empty" style="padding:10px 0">今天还没有选择</div>';h+='</div>'});document.getElementById('todayList').innerHTML=h+'</div>'}
function renderRecords(){const l=document.getElementById('recordList');if(!orders.length){l.innerHTML='<div class="empty">还没有点菜记录</div>';return}const bd={};orders.forEach(o=>(bd[o.date]=bd[o.date]||[]).push(o));l.innerHTML=Object.keys(bd).sort().reverse().map(d=>`<div class="card"><div class="datehead">📅 ${d}　🔥 当天 ${Math.round(totalCal(bd[d]))} kcal</div>${bd[d].sort((a,b)=>b.ts-a.ts).map(i=>`<div class="record-item"><div><div class="rtxt">${CAT_ICON[i.mealTime]||''} ${esc(i.mealTime)} · ${esc(i.name)}</div><div class="mini">${esc(i.portion||'')}${i.cook?' · '+esc(i.cook):''}${i.extras?' · '+esc(i.extras):''}</div><div class="cal">🔥 ${esc(i.calories)} kcal</div></div><button class="delete-record" onclick="deleteRecord('${i.id}')">删除</button></div>`).join('')}</div>`).join('')}
function openCalorieEditor(id){const o=orders.find(x=>x.id===id);if(!o)return;document.getElementById('editOrderId').value=id;document.getElementById('calorieFoodName').textContent=o.name;document.getElementById('editOrderCalories').value=o.calories;document.getElementById('calorieModal').classList.add('show')} function closeCalorieModal(){document.getElementById('calorieModal').classList.remove('show')} function saveOrderCalories(){const o=orders.find(x=>x.id===document.getElementById('editOrderId').value);if(o)o.calories=numCal(document.getElementById('editOrderCalories').value);saveData();closeCalorieModal();renderTodayMenu()} function cancelOrder(id){orders=orders.filter(o=>o.id!==id);saveData();renderTodayMenu()} function deleteRecord(id){showConfirm('确定要删除这条点菜记录吗？',()=>{orders=orders.filter(o=>o.id!==id);saveData();renderRecords()})}
function showConfirm(m,fn){pendingConfirmFn=fn;document.getElementById('confirmMsg').textContent=m;document.getElementById('confirmModal').classList.add('show')} function closeConfirm(){pendingConfirmFn=null;document.getElementById('confirmModal').classList.remove('show')} function runConfirm(){const f=pendingConfirmFn;closeConfirm();if(f)f()}
function exportData(){const data={app:'我的一日三餐',version:4,exportedAt:new Date().toISOString(),orders},b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`我的一日三餐_备份_${getToday()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.orders))throw 0;orders=d.orders;saveData();alert('资料已成功导入。')}catch(_){alert('备份文件无法读取。')}};r.readAsText(f)} function confirmResetData(){showConfirm('确定要清除所有点菜记录吗？',()=>{orders=[];saveData();renderRecords()})}
</script></body></html>
