<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f6dca5">
<title>我的记录本</title>
<style>
*{box-sizing:border-box}
:root{--bg:#fff7e7;--card:#fffdf8;--ink:#43382d;--muted:#8b7c6c;--line:#eadcc8;--accent:#d99554;--soft:#f7e7ca;--doctor:#dceee7;--shadow:0 8px 24px rgba(86,63,37,.09)}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--ink);background:linear-gradient(160deg,#fffaf0,#f7e1b8)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:auto;padding:18px 16px 110px}
.header{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 18px}
.title h1{font-size:27px;margin:0 0 4px}.title p{margin:0;color:var(--muted);font-size:13px}
.iconBtn{border:0;background:#fff9ed;border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.hero{background:rgba(255,253,248,.92);border:1px solid rgba(255,255,255,.7);border-radius:24px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.heroTop{display:flex;justify-content:space-between;gap:12px;align-items:center}
.hero h2{margin:0 0 5px;font-size:19px}.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.doctorBtn{border:0;background:var(--doctor);color:#365f50;padding:11px 14px;border-radius:14px;font-weight:700;white-space:nowrap}
.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px 14px;outline:none;margin:2px 0 12px}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:5px;margin-bottom:10px}
.tab{border:1px solid var(--line);background:#fffaf1;padding:8px 13px;border-radius:999px;color:#725f4c;white-space:nowrap}
.tab.active{background:#5b4b3d;color:white;border-color:#5b4b3d}
.sectionHead{display:flex;justify-content:space-between;align-items:center;margin:14px 3px 9px}
.sectionHead b{font-size:16px}.count{font-size:12px;color:var(--muted)}
.empty{text-align:center;background:rgba(255,255,255,.55);border:1px dashed #dcc9ad;border-radius:18px;padding:35px 15px;color:var(--muted)}
.card{background:var(--card);border:1px solid rgba(226,210,188,.75);border-radius:20px;padding:15px;margin-bottom:10px;box-shadow:0 5px 16px rgba(83,62,37,.06)}
.cardTop{display:flex;justify-content:space-between;gap:10px}
.badge{display:inline-block;font-size:12px;border-radius:999px;padding:5px 9px;background:var(--soft);margin-bottom:7px}
.badge.doctor{background:var(--doctor);color:#35604f}
.card h3{font-size:17px;margin:0 0 6px}.date{font-size:12px;color:var(--muted);white-space:nowrap}
.note{white-space:pre-wrap;font-size:14px;line-height:1.55;color:#5c4f43;margin-top:8px}
.meta{margin-top:9px;padding-top:9px;border-top:1px solid #f0e6d8;font-size:13px;line-height:1.7;color:#66594c}
.actions{display:flex;gap:7px;margin-top:10px;justify-content:flex-end}
.smallBtn{border:0;border-radius:10px;padding:7px 10px;background:#f4eadc;color:#5d4c3c}
.danger{background:#f8e3df;color:#934c40}
.reminder{margin-top:9px;background:#fff2d8;border-radius:12px;padding:8px 10px;font-size:12px;color:#86652d}
.fab{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:min(688px,calc(100% - 32px));border:0;background:#4d4035;color:white;border-radius:18px;padding:15px;font-weight:800;font-size:16px;box-shadow:0 12px 28px rgba(58,45,34,.28)}
.modal{display:none;position:fixed;inset:0;background:rgba(42,34,27,.38);z-index:20;padding:18px;overflow:auto}
.modal.show{display:block}#medicalModal{z-index:20}#packageModal,#medicalRecordModal,#packageDetailModal,#sessionModal{z-index:30}.sheet{max-width:680px;margin:30px auto;background:#fffaf2;border-radius:25px;padding:19px;box-shadow:0 18px 50px rgba(0,0,0,.18)}
.sheet h2{margin:2px 0 15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{margin-bottom:11px}.field label{display:block;font-size:12px;color:#786857;margin:0 0 5px}
.field input,.field textarea,.field select{width:100%;border:1px solid #e5d6c1;background:white;border-radius:12px;padding:11px;outline:none}
.field textarea{min-height:88px;resize:vertical}
.full{grid-column:1/-1}.modalBtns{display:flex;gap:9px;margin-top:8px}.modalBtns button{flex:1;border:0;border-radius:13px;padding:12px;font-weight:700}.save{background:#544538;color:white}.cancel{background:#eee3d4;color:#655647}
.settingsRow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.settingsRow button{border:0;background:#f2e5d2;padding:11px;border-radius:12px}
.hidden{display:none!important}
@media(max-width:560px){.grid{grid-template-columns:1fr}.heroTop{align-items:flex-start}.doctorBtn{padding:10px 11px}.sheet{margin:5px auto}.wrap{padding-top:13px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="title"><h1>📒 我的记录本</h1><p>生活小事和看医生资料，都放在这里</p></div>
    <button class="iconBtn" onclick="openSettings()">⚙️</button>
  </div>
  <input id="search" class="search" placeholder="🔍 搜索标题、医生、诊所、内容……" oninput="render()">
  <div class="tabs">
    <button class="tab active" data-filter="all" onclick="setFilter('all',this)">全部</button>
    
    <button class="tab" data-filter="work" onclick="setFilter('work',this)">💼 工作</button>
    <button class="tab" data-filter="life" onclick="setFilter('life',this)">🏠 生活</button>
    <button class="tab" data-filter="medical" onclick="openMedicalPage()">🏥 医疗</button>
    <button class="tab" data-filter="birthday" onclick="setFilter('birthday',this)">🎂 生日</button>
    <button class="tab" data-filter="anniversary" onclick="setFilter('anniversary',this)">❤️ 纪念日</button>
    <button class="tab" data-filter="other" onclick="setFilter('other',this)">📝 其他</button>
  </div>

  <div class="sectionHead"><b>最近记录</b><span id="count" class="count"></span></div>
  <div id="list"></div>
</div>

<button class="fab" onclick="openForm('normal')">＋ 新增记录</button>

<div id="formModal" class="modal">
  <div class="sheet">
    <h2 id="formTitle">新增记录</h2>
    <input type="hidden" id="editId">
    <input type="hidden" id="recordType">
    <div class="grid">
      <div class="field"><label>日期</label><input type="date" id="date"></div>
      <div id="normalCategory" class="field"><label>分类</label>
        <select id="category"><option value="life">🏠 生活</option><option value="work">💼 工作</option><option value="birthday">🎂 生日</option><option value="anniversary">❤️ 纪念日</option><option value="other">📝 其他</option></select>
      </div>
      <div class="field full"><label>标题</label><input id="title" placeholder="例如：今天要记的事情"></div>

      <div id="doctorFields" class="full hidden">
        <div class="grid">
          <div class="field"><label>医院 / 诊所</label><input id="clinic" placeholder="诊所或医院名称"></div>
          <div class="field"><label>医生名字</label><input id="doctor" placeholder="Dr. ..."></div>
          <div class="field"><label>科别</label><input id="department" placeholder="例如：骨科、内科"></div>
          <div class="field"><label>费用</label><input id="cost" inputmode="decimal" placeholder="例如：120.00"></div>
          <div class="field full"><label>这次为什么看医生 / 症状</label><textarea id="symptoms" placeholder="哪里不舒服、多久了……"></textarea></div>
          <div class="field full"><label>医生怎么说</label><textarea id="diagnosis" placeholder="医生的说明 / 诊断"></textarea></div>
          <div class="field full"><label>药物 / 治疗</label><textarea id="treatment" placeholder="药名、治疗方式等"></textarea></div>
          <div class="field full"><label>检查 / 报告</label><textarea id="tests" placeholder="验血、X-ray、MRI、检查结果等"></textarea></div>
          <div class="field full"><label>本次项目</label>
            <div style="display:flex;gap:10px;flex-wrap:wrap">
              <label style="background:#f6eee2;padding:10px 13px;border-radius:12px"><input type="checkbox" id="waist"> 拉腰</label>
              <label style="background:#f6eee2;padding:10px 13px;border-radius:12px"><input type="checkbox" id="neck"> 拉颈项</label>
              <label style="background:#f6eee2;padding:10px 13px;border-radius:12px"><input type="checkbox" id="chiro"> Chiro</label>
            </div>
          </div>
        </div>
      </div>

      <div class="field full"><label>备注</label><textarea id="notes" placeholder="其他想记录的内容……"></textarea></div>
    </div>
    <div class="modalBtns"><button class="cancel" onclick="closeForm()">取消</button><button class="save" onclick="saveRecord()">保存记录</button></div>
  </div>
</div>



<div id="medicalModal" class="modal">
  <div class="sheet">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <div><h2 style="margin-bottom:4px">🏥 医疗</h2><div style="font-size:13px;color:#7c6d5c">治疗配套和单独看医生记录</div></div>
      <button class="smallBtn" onclick="closeMedicalPage()">✕</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0 9px">
      <button class="save" style="border:0;border-radius:13px;padding:12px" onclick="openMedicalRecordForm()">＋ 看医生</button>
      <button class="save" style="border:0;border-radius:13px;padding:12px" onclick="openPackageForm()">＋ 配套</button>
    </div>
    <div class="sectionHead"><b>医疗记录</b><span id="medicalCount" class="count"></span></div>
    <div id="medicalList"></div>
  </div>
</div>

<div id="medicalRecordModal" class="modal">
  <div class="sheet">
    <h2 id="medicalRecordTitle">＋ 看医生</h2>
    <input type="hidden" id="medicalRecordId">
    <div class="grid">
      <div class="field"><label>日期</label><input type="date" id="medicalDate"></div>
      <div class="field full"><label>名称</label><input id="medicalName" placeholder="例如：看骨科、看中医、牙医"></div>
      <div class="field"><label>金额</label><input id="medicalAmount" inputmode="decimal" placeholder="例如：80.00"></div>
      <div class="field full"><label>备注</label><textarea id="medicalNotes" placeholder="想记录的内容"></textarea></div>
    </div>
    <div class="modalBtns"><button class="cancel" onclick="closeMedicalRecordForm()">取消</button><button class="save" onclick="saveMedicalRecord()">保存</button></div>
  </div>
</div>

<div id="packageModal" class="modal">
  <div class="sheet">
    <h2 id="packageFormTitle">📦 添加配套</h2>
    <input type="hidden" id="packageEditId">
    <div class="grid">
      <div class="field full"><label>配套名称</label><input id="packageName" placeholder="例如：Chiro 配套"></div>
      <div class="field"><label>配套金额</label><input id="packageAmount" inputmode="decimal" placeholder="例如：1200.00"></div>
      <div class="field"><label>拉腰 / 拉颈项共享次数</label><input id="packageStretchTotal" type="number" min="1" value="16"></div>
      <div class="field"><label>Chiro 次数</label><input id="packageChiroTotal" type="number" min="1" value="8"></div>
      <div class="field full"><label>诊所 / 医生（选填）</label><input id="packageClinic" placeholder="例如：ABC Chiropractic"></div>
      <div class="field full"><label>备注（选填）</label><textarea id="packageNotes"></textarea></div>
    </div>
    <div class="modalBtns"><button class="cancel" onclick="closePackageForm()">取消</button><button class="save" onclick="savePackage()">保存配套</button></div>
  </div>
</div>

<div id="packageDetailModal" class="modal">
  <div class="sheet">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
      <div><h2 id="detailName" style="margin-bottom:5px"></h2><div id="detailSummary" style="color:#7c6d5c;font-size:13px"></div></div>
      <button class="smallBtn" onclick="closePackageDetail()">✕</button>
    </div>
    <div id="sessionList" style="margin-top:15px"></div>
    <div class="modalBtns">
      <button class="cancel" onclick="editCurrentPackage()">✏️ 编辑配套</button>
      <button class="save" id="addSessionBtn" onclick="openSessionForm()">＋ 记录一次</button>
    </div>
  </div>
</div>

<div id="sessionModal" class="modal">
  <div class="sheet">
    <h2 id="sessionTitle">记录治疗</h2>
    <input type="hidden" id="sessionEditIndex">
    <div class="grid">
      <div class="field"><label>日期</label><input id="sessionDate" type="date"></div>
      <div class="field full"><label>本次项目</label>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <label style="background:#f6eee2;padding:10px 13px;border-radius:12px"><input type="checkbox" id="sessionWaist"> 拉腰</label>
          <label style="background:#f6eee2;padding:10px 13px;border-radius:12px"><input type="checkbox" id="sessionNeck"> 拉颈项</label>
          <label style="background:#f6eee2;padding:10px 13px;border-radius:12px"><input type="checkbox" id="sessionChiro"> Chiro</label>
        </div>
      </div>
      <div class="field full"><label>备注</label><textarea id="sessionNotes" placeholder="当天治疗情况、医生说明等"></textarea></div>
    </div>
    <div class="modalBtns"><button class="cancel" onclick="closeSessionForm()">取消</button><button class="save" onclick="saveSession()">保存</button></div>
  </div>
</div>
<div id="settingsModal" class="modal">
  <div class="sheet">
    <h2>⚙️ 资料备份</h2>
    <p style="color:#7c6d5c;font-size:14px;line-height:1.6">记录会保存在这个浏览器里。建议偶尔导出备份，换手机或清除浏览器资料前尤其要备份。</p>
    <div class="settingsRow">
      <button onclick="exportData()">📤 导出备份</button>
      <button onclick="document.getElementById('importFile').click()">📥 导入恢复</button>
    </div>
    <input id="importFile" type="file" accept=".json,application/json" class="hidden" onchange="importData(event)">
    <div class="modalBtns" style="margin-top:16px"><button class="cancel" onclick="closeSettings()">关闭</button></div>
  </div>
</div>

<script>
const KEY='myRecordBook_v1';
let records=JSON.parse(localStorage.getItem(KEY)||'[]');
let currentFilter='all';
const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function label(cat){return {package:'🏥 医生配套',doctor:'🏥 医生记录',medical:'🏥 医疗',birthday:'🎂 生日',anniversary:'❤️ 纪念日',work:'💼 工作',life:'🏠 生活',other:'📝 其他'}[cat]||'📝 其他'}
function saveAll(){localStorage.setItem(KEY,JSON.stringify(records))}
function setFilter(f,btn){currentFilter=f;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render()}
function render(){
 const q=$('search').value.trim().toLowerCase();
 let arr=[];
 records.forEach(r=>{
   if(r.category==='package'){
     (r.sessions||[]).forEach((x,i)=>arr.push({id:r.id+'__session__'+i,category:'medicalSession',date:x.date||r.date,created:(r.created||0)+i,title:r.title||'医疗配套',packageName:r.title||'医疗配套',waist:!!x.waist,neck:!!x.neck,chiro:!!x.chiro,notes:x.notes||''}));
   } else arr.push(r);
 });
 arr.sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.created||0)-(a.created||0));
 arr=arr.filter(r=>(currentFilter==='all'||r.category===currentFilter)&&(!q||JSON.stringify(r).toLowerCase().includes(q)));
 $('count').textContent=arr.length+' 条';
 if(!arr.length){$('list').innerHTML='<div class="empty">还没有记录 🌿<br><small>按下面的「新增记录」开始记录吧</small></div>';return}
 $('list').innerHTML=arr.map(r=>{
   if(r.category==='medicalRecord'){
     return `<div class="card"><div class="cardTop"><div><span class="badge doctor">🏥 医疗 · 看医生</span><h3>${esc(r.title||'医疗记录')}</h3></div><div class="date">${esc(r.date||'')}</div></div>${r.amount?`<div class="note">💰 ${esc(r.amount)}</div>`:''}${r.notes?`<div class="note">${esc(r.notes)}</div>`:''}<div class="actions"><button class="smallBtn" onclick="openMedicalPage();setTimeout(()=>editMedicalRecord('${r.id}'),0)">✏️ 编辑</button></div></div>`;
   }
   if(r.category==='medicalSession'){
     const done=[r.waist?'☑ 拉腰':'',r.neck?'☑ 拉颈项':'',r.chiro?'☑ Chiro':''].filter(Boolean).join('　')||'治疗记录';
     return `<div class="card"><div class="cardTop"><div><span class="badge doctor">🏥 医疗 · 配套治疗</span><h3>${esc(r.packageName)}</h3></div><div class="date">${esc(r.date||'')}</div></div><div class="note">${done}</div>${r.notes?`<div class="note">${esc(r.notes)}</div>`:''}</div>`;
   }
   if(r.category==='package'){
     const sessions=r.sessions||[];
     const stretchTotal=Number(r.stretchTotal)||16, chiroTotal=Number(r.chiroTotal)||8;
     const stretchUsed=sessions.reduce((n,x)=>n+(x.waist?1:0)+(x.neck?1:0)+(x.stretch&&!x.waist&&!x.neck?1:0),0);
     const chiroUsed=sessions.filter(x=>x.chiro).length;
     const stretchPct=Math.min(100,Math.round(stretchUsed/stretchTotal*100));
     const chiroPct=Math.min(100,Math.round(chiroUsed/chiroTotal*100));
     const latest=sessions.length?[...sessions].sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0]:null;
     return `<div class="card" onclick="openPackageDetail('${r.id}')" style="cursor:pointer">
       <div class="cardTop"><div><span class="badge doctor">🏥 医生配套</span><h3>${esc(r.title||'未命名配套')}</h3></div><div class="date">${stretchUsed>=stretchTotal&&chiroUsed>=chiroTotal?'✅ 已完成':'治疗配套'}</div></div>
       <div class="meta" style="border-top:0;padding-top:2px">
         ${r.amount?`💰 金额：${esc(r.amount)}<br>`:''}
         ${r.clinic?`🏥 ${esc(r.clinic)}<br>`:''}
         <div style="margin-top:8px"><b>拉腰 / 拉颈项　${stretchUsed} / ${stretchTotal}</b>
         <div style="height:9px;background:#eee3d5;border-radius:999px;overflow:hidden;margin:6px 0 10px"><div style="height:100%;width:${stretchPct}%;background:#6e9b89"></div></div>
         <b>Chiro　${chiroUsed} / ${chiroTotal}</b>
         <div style="height:9px;background:#eee3d5;border-radius:999px;overflow:hidden;margin:6px 0 8px"><div style="height:100%;width:${chiroPct}%;background:#6e9b89"></div></div></div>
         ${latest?`最近一次：${esc(latest.date)}`:''}
       </div>
       <div style="text-align:right;margin-top:8px;font-size:13px;color:#826d57">点开查看详情 ＞</div>
     </div>`;
   }
   let meta='';
   if(r.category==='doctor'){
     const bits=[];
     if(r.clinic) bits.push('🏥 '+esc(r.clinic));
     if(r.doctor) bits.push('👨‍⚕️ '+esc(r.doctor));
     if(r.department) bits.push('🩺 '+esc(r.department));
     if(r.symptoms) bits.push('<b>症状：</b>'+esc(r.symptoms));
     if(r.diagnosis) bits.push('<b>医生说明：</b>'+esc(r.diagnosis));
     if(r.treatment) bits.push('<b>药物/治疗：</b>'+esc(r.treatment));
     if(r.tests) bits.push('<b>检查：</b>'+esc(r.tests));
     if(r.cost) bits.push('💰 '+esc(r.cost));
     meta=bits.length?'<div class="meta">'+bits.join('<br>')+'</div>':'';
   }
   let rem='';
   if(r.category==='doctor' && (r.waist||r.neck||r.chiro)){
     const done=[r.waist?'☑ 拉腰':'',r.neck?'☑ 拉颈项':'',r.chiro?'☑ Chiro':''].filter(Boolean);
     rem=`<div class="reminder">本次项目：${done.join('　')}</div>`;
   }
   return `<div class="card">
    <div class="cardTop"><div><span class="badge ${r.category==='doctor'?'doctor':''}">${label(r.category)}</span><h3>${esc(r.title||'未命名记录')}</h3></div><div class="date">${esc(r.date||'')}</div></div>
    ${r.notes?`<div class="note">${esc(r.notes)}</div>`:''}${meta}${rem}
    <div class="actions"><button class="smallBtn" onclick="editRecord('${r.id}')">✏️ 编辑</button><button class="smallBtn danger" onclick="deleteRecord('${r.id}')">🗑️ 删除</button></div>
   </div>`
 }).join('');
}
function clearForm(){
 ['editId','title','clinic','doctor','department','cost','symptoms','diagnosis','treatment','tests','notes'].forEach(id=>$(id).value='');
 $('date').value=today(); $('category').value='life'; $('waist').checked=false; $('neck').checked=false; $('chiro').checked=false;
}
function openForm(type='normal'){
 clearForm(); $('recordType').value=type;
 const doc=type==='doctor';
 $('doctorFields').classList.toggle('hidden',!doc);$('normalCategory').classList.toggle('hidden',doc);
 $('formTitle').textContent=doc?'🏥 新增医生记录':'新增记录';$('formModal').classList.add('show');
}
function closeForm(){$('formModal').classList.remove('show')}
function saveRecord(){
 const type=$('recordType').value;
 const id=$('editId').value||('r'+Date.now());
 const old=records.find(x=>x.id===id);
 const r={id,created:old?.created||Date.now(),date:$('date').value||today(),category:type==='doctor'?'doctor':$('category').value,title:$('title').value.trim(),notes:$('notes').value.trim()};
 if(type==='doctor') Object.assign(r,{clinic:$('clinic').value.trim(),doctor:$('doctor').value.trim(),department:$('department').value.trim(),cost:$('cost').value.trim(),symptoms:$('symptoms').value.trim(),diagnosis:$('diagnosis').value.trim(),treatment:$('treatment').value.trim(),tests:$('tests').value.trim(),waist:$('waist').checked,neck:$('neck').checked,chiro:$('chiro').checked});
 const i=records.findIndex(x=>x.id===id); if(i>=0)records[i]=r;else records.push(r);
 saveAll();closeForm();render();
}
function editRecord(id){
 const r=records.find(x=>x.id===id);if(!r)return;
 openForm(r.category==='doctor'?'doctor':'normal');$('editId').value=r.id;$('date').value=r.date||today();$('title').value=r.title||'';$('notes').value=r.notes||'';
 if(r.category!=='doctor')$('category').value=r.category||'life';
 else {['clinic','doctor','department','cost','symptoms','diagnosis','treatment','tests'].forEach(k=>$(k).value=r[k]||''); $('waist').checked=!!r.waist; $('neck').checked=!!r.neck; $('chiro').checked=!!r.chiro;}
 $('formTitle').textContent='✏️ 编辑记录';
}
function deleteRecord(id){if(confirm('确定要删除这条记录吗？')){records=records.filter(x=>x.id!==id);saveAll();render()}}
function openSettings(){$('settingsModal').classList.add('show')}
function closeSettings(){$('settingsModal').classList.remove('show')}
function exportData(){
 const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),records},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='我的记录本备份_'+today()+'.json';a.click();URL.revokeObjectURL(a.href);
}
function importData(e){
 const f=e.target.files[0];if(!f)return;const reader=new FileReader();
 reader.onload=()=>{try{const d=JSON.parse(reader.result);const incoming=Array.isArray(d)?d:d.records;if(!Array.isArray(incoming))throw 0;if(confirm('导入会替换目前的记录，确定继续吗？')){records=incoming;saveAll();render();closeSettings();alert('导入完成');}}catch{alert('这个备份文件无法读取。')}e.target.value=''};
 reader.readAsText(f);
}
window.addEventListener('click',e=>{if(e.target===$('formModal'))closeForm();if(e.target===$('settingsModal'))closeSettings()});


function moneyNumber(v){const n=parseFloat(String(v||'').replace(/[^0-9.-]/g,''));return isNaN(n)?0:n}
function openMedicalPage(){$('medicalModal').classList.add('show');renderMedical()}
function closeMedicalPage(){$('medicalModal').classList.remove('show')}
function renderMedical(){
  const arr=[...records].filter(r=>r.category==='package'||r.category==='medicalRecord').sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.created||0)-(a.created||0));
  $('medicalCount').textContent=arr.length+' 项';
  if(!arr.length){$('medicalList').innerHTML='<div class="empty">还没有医疗记录</div>';return}
  $('medicalList').innerHTML=arr.map(r=>{
    if(r.category==='package'){
      const sessions=r.sessions||[], st=Number(r.stretchTotal)||16, ct=Number(r.chiroTotal)||8;
      const su=sessions.reduce((n,x)=>n+(x.waist?1:0)+(x.neck?1:0)+(x.stretch&&!x.waist&&!x.neck?1:0),0), cu=sessions.filter(x=>x.chiro).length;
      return `<div class="card" onclick="openPackageDetail('${r.id}')" style="cursor:pointer">
        <div class="cardTop"><div><span class="badge doctor">配套</span><h3>${esc(r.title||'医疗配套')}</h3></div><div class="date">${su>=st&&cu>=ct?'✅ 已完成':'使用中'}</div></div>
        ${r.amount?`<div class="note">💰 ${esc(r.amount)}</div>`:''}
        <div class="meta"><b>拉腰 / 拉颈项：${su} / ${st}</b><br><b>Chiro：${cu} / ${ct}</b></div>
        <div style="text-align:right;margin-top:8px;font-size:13px;color:#826d57">查看配套 ＞</div>
      </div>`;
    }
    return `<div class="card">
      <div class="cardTop"><div><span class="badge">看医生</span><h3>${esc(r.title||'医疗记录')}</h3></div><div class="date">${esc(r.date||'')}</div></div>
      ${r.amount?`<div class="note">💰 ${esc(r.amount)}</div>`:''}
      ${r.notes?`<div class="note">${esc(r.notes)}</div>`:''}
      <div class="actions"><button class="smallBtn" onclick="editMedicalRecord('${r.id}')">✏️ 编辑</button><button class="smallBtn danger" onclick="deleteMedicalRecord('${r.id}')">🗑️ 删除</button></div>
    </div>`;
  }).join('');
}
function openMedicalRecordForm(id=''){
  const r=records.find(x=>x.id===id);
  $('medicalRecordId').value=id;$('medicalRecordTitle').textContent=r?'✏️ 编辑医疗记录':'＋ 看医生';
  $('medicalDate').value=r?.date||today();$('medicalName').value=r?.title||'';$('medicalAmount').value=r?.amount||'';$('medicalNotes').value=r?.notes||'';
  $('medicalRecordModal').classList.add('show');
}
function closeMedicalRecordForm(){$('medicalRecordModal').classList.remove('show')}
function saveMedicalRecord(){
  const id=$('medicalRecordId').value||('m'+Date.now()),old=records.find(x=>x.id===id);
  const r={id,created:old?.created||Date.now(),date:$('medicalDate').value||today(),category:'medicalRecord',medicalType:'看医生',title:$('medicalName').value.trim()||'看医生',amount:$('medicalAmount').value.trim(),notes:$('medicalNotes').value.trim()};
  const i=records.findIndex(x=>x.id===id);if(i>=0)records[i]=r;else records.push(r);
  saveAll();closeMedicalRecordForm();renderMedical();render();
}
function editMedicalRecord(id){openMedicalRecordForm(id)}
function deleteMedicalRecord(id){if(confirm('确定删除这条医疗记录吗？')){records=records.filter(x=>x.id!==id);saveAll();renderMedical();render()}}
let currentPackageId=null;
function openPackageForm(id=''){
  $('packageEditId').value=id;
  const r=records.find(x=>x.id===id);
  $('packageFormTitle').textContent=r?'✏️ 编辑配套':'📦 添加配套';
  $('packageName').value=r?.title||'';
  $('packageAmount').value=r?.amount||'';
  $('packageStretchTotal').value=r?.stretchTotal||16; $('packageChiroTotal').value=r?.chiroTotal||8;
  $('packageClinic').value=r?.clinic||'';
  $('packageNotes').value=r?.notes||'';
  $('packageModal').classList.add('show');
}
function closePackageForm(){$('packageModal').classList.remove('show')}
function savePackage(){
  const id=$('packageEditId').value||('p'+Date.now());
  const old=records.find(x=>x.id===id);
  const stretchTotal=Math.max(1,parseInt($('packageStretchTotal').value)||16); const chiroTotal=Math.max(1,parseInt($('packageChiroTotal').value)||8);
  const r={id,created:old?.created||Date.now(),date:old?.date||today(),category:'package',
    title:$('packageName').value.trim()||'医生配套',amount:$('packageAmount').value.trim(),
    stretchTotal,chiroTotal,clinic:$('packageClinic').value.trim(),notes:$('packageNotes').value.trim(),sessions:old?.sessions||[]};
  const i=records.findIndex(x=>x.id===id); if(i>=0)records[i]=r; else records.push(r);
  saveAll();closePackageForm();render();renderMedical();
}
function openPackageDetail(id){
  currentPackageId=id; const r=records.find(x=>x.id===id); if(!r)return;
  $('detailName').textContent=r.title||'医生配套';
  const sessions=r.sessions||[], stretchTotal=Number(r.stretchTotal)||16, chiroTotal=Number(r.chiroTotal)||8;
  const stretchUsed=sessions.reduce((n,x)=>n+(x.waist?1:0)+(x.neck?1:0)+(x.stretch&&!x.waist&&!x.neck?1:0),0), chiroUsed=sessions.filter(x=>x.chiro).length;
  $('detailSummary').innerHTML=`${r.amount?'金额：'+esc(r.amount)+'<br>':''}<b>拉腰 / 拉颈项：${stretchUsed} / ${stretchTotal}</b><br><b>Chiro：${chiroUsed} / ${chiroTotal}</b>${r.clinic?'<br>'+esc(r.clinic):''}${r.notes?'<br>'+esc(r.notes):''}`;
  $('sessionList').innerHTML=sessions.length?sessions.map((x,i)=>{
    const done=[x.waist?'☑ 拉腰':'',x.neck?'☑ 拉颈项':'',(x.stretch&&!x.waist&&!x.neck)?'☑ 拉腰/拉颈项（旧记录）':'',x.chiro?'☑ Chiro':''].filter(Boolean).join('　')||'未勾选项目';
    return `<div class="card" style="box-shadow:none"><div class="cardTop"><b>第 ${i+1} 次</b><span class="date">${esc(x.date||'')}</span></div>
      <div class="note">${done}</div>${x.notes?`<div class="note">${esc(x.notes)}</div>`:''}
      <div class="actions"><button class="smallBtn" onclick="event.stopPropagation();editSession(${i})">✏️ 编辑</button><button class="smallBtn danger" onclick="event.stopPropagation();deleteSession(${i})">🗑️</button></div></div>`;
  }).join(''):'<div class="empty">这个配套还没有使用记录</div>';
  const complete=stretchUsed>=stretchTotal&&chiroUsed>=chiroTotal;
  $('addSessionBtn').disabled=complete;
  $('addSessionBtn').textContent=complete?'✅ 配套已完成':'＋ 记录治疗';
  $('packageDetailModal').classList.add('show');
}
function closePackageDetail(){$('packageDetailModal').classList.remove('show')}
function editCurrentPackage(){const id=currentPackageId;closePackageDetail();openPackageForm(id)}
function openSessionForm(){
  const r=records.find(x=>x.id===currentPackageId); if(!r)return;
  $('sessionEditIndex').value='';$('sessionDate').value=today();$('sessionWaist').checked=false;$('sessionNeck').checked=false;$('sessionChiro').checked=false;$('sessionNotes').value='';
  $('sessionTitle').textContent='记录第 '+((r.sessions||[]).length+1)+' 次治疗';$('sessionModal').classList.add('show');
}
function closeSessionForm(){$('sessionModal').classList.remove('show')}
function saveSession(){
  const r=records.find(x=>x.id===currentPackageId);if(!r)return;
  r.sessions=r.sessions||[];
  const x={date:$('sessionDate').value||today(),waist:$('sessionWaist').checked,neck:$('sessionNeck').checked,chiro:$('sessionChiro').checked,notes:$('sessionNotes').value.trim()};
  const idx=$('sessionEditIndex').value;
  const test=[...r.sessions]; if(idx==='')test.push(x);else test[Number(idx)]=x;
  const stretchUsed=test.reduce((n,a)=>n+(a.waist?1:0)+(a.neck?1:0)+(a.stretch&&!a.waist&&!a.neck?1:0),0);
  const chiroUsed=test.filter(a=>a.chiro).length;
  if(stretchUsed>Number(r.stretchTotal||16)){alert('拉腰 / 拉颈项共享的配套次数已经超过 '+Number(r.stretchTotal||16)+' 次。');return}
  if(chiroUsed>Number(r.chiroTotal||8)){alert('Chiro 配套次数已经超过 '+Number(r.chiroTotal||8)+' 次。');return}
  if(idx==='')r.sessions.push(x);else r.sessions[Number(idx)]=x;
  saveAll();closeSessionForm();openPackageDetail(r.id);render();renderMedical();
}
function editSession(i){
  const r=records.find(x=>x.id===currentPackageId),x=r?.sessions?.[i];if(!x)return;
  $('sessionEditIndex').value=i;$('sessionDate').value=x.date||today();$('sessionWaist').checked=!!x.waist;$('sessionNeck').checked=!!x.neck;$('sessionChiro').checked=!!x.chiro;$('sessionNotes').value=x.notes||'';
  $('sessionTitle').textContent='✏️ 编辑第 '+(i+1)+' 次';$('sessionModal').classList.add('show');
}
function deleteSession(i){
  if(!confirm('确定删除这一次记录吗？'))return;
  const r=records.find(x=>x.id===currentPackageId);if(!r)return;r.sessions.splice(i,1);saveAll();openPackageDetail(r.id);render();renderMedical();
}
render();
</script>
