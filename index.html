<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刘太厨房</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  background:#fff8f2;
  color:#3d2b24;
}
header{
  background:#f6c7a8;
  padding:28px 20px;
  text-align:center;
}
header h1{margin:0;font-size:30px}
header p{margin:8px 0 0;color:#76564a}
nav{
  display:flex;
  justify-content:center;
  gap:8px;
  padding:15px;
  background:white;
}
nav button{
  border:0;
  padding:10px 15px;
  border-radius:20px;
  background:#fff0e5;
  color:#8b5437;
}
nav button.active{
  background:#e89a68;
  color:white;
}
main{
  max-width:650px;
  margin:auto;
  padding:15px;
}
.card{
  background:white;
  border-radius:20px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}
.food{font-size:42px}
.tag{
  display:inline-block;
  background:#fff0e5;
  color:#9b603e;
  padding:5px 9px;
  border-radius:10px;
  font-size:13px;
}
button.action{
  border:0;
  background:#e89a68;
  color:white;
  padding:11px 17px;
  border-radius:14px;
  font-weight:bold;
}
button.delete{
  border:0;
  background:#eee;
  padding:8px 12px;
  border-radius:12px;
}
input,textarea,select{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  margin:7px 0 12px;
  border:1px solid #ead8cc;
  border-radius:12px;
  font-size:15px;
}
.hidden{display:none}
.empty{text-align:center;padding:35px;color:#987d70}
</style>
</head>

<body>

<header>
  <h1>🍳 刘太厨房</h1>
  <p>一家人的点菜 · 食谱</p>
</header>

<nav>
  <button class="active" onclick="page('order',this)">🍽️ 点菜</button>
  <button onclick="page('today',this)">📋 今日菜单</button>
  <button onclick="page('recipes',this)">📖 食谱</button>
  <button onclick="page('add',this)">➕ 加食谱</button>
</nav>

<main>

<section id="order">
<h2>今天想吃什么？</h2>
<div id="orderList"></div>
</section>

<section id="today" class="hidden">
<h2>📋 今日菜单</h2>
<div id="todayList"></div>
</section>

<section id="recipes" class="hidden">
<h2>📖 刘太食谱</h2>
<div id="recipeList"></div>
</section>

<section id="add" class="hidden">
<h2>➕ 添加新食谱</h2>

<div class="card">

<label>菜名</label>
<input id="name" placeholder="例如：黑椒鸡扒">

<label>分类</label>
<select id="category">
<option>鸡肉</option>
<option>猪肉</option>
<option>牛肉</option>
<option>鱼</option>
<option>汤</option>
<option>意面</option>
<option>其他</option>
</select>

<label>材料</label>
<textarea id="ingredients" rows="4"
placeholder="例如：鸡腿、黑胡椒、洋葱……"></textarea>

<label>做法</label>
<textarea id="instructions" rows="6"
placeholder="写下你的做法……"></textarea>

<button class="action" onclick="addRecipe()">
保存食谱 ❤️
</button>

</div>
</section>

</main>

<script>

/* =========================
   把下面两项换成你自己的资料
   ========================= */

const SUPABASE_URL = "https://vgkjqpzktytadjavgzzn.supabase.co/rest/v1/"；

const SUPABASE_KEY = "sb_publishable_4ULyasIw_XqkjnLYbs90LA_MVrn1Ami";


/* =========================
   食谱
   ========================= */

let recipes = [];

async function loadRecipes(){

  const response = await fetch(
    SUPABASE_URL + "/rest/v1/recipes?select=*",
    {
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer " + SUPABASE_KEY
      }
    }
  );

  recipes = await response.json();

  if(!Array.isArray(recipes)){
    recipes=[];
  }

  renderRecipes();
  renderOrder();
}


/* =========================
   显示点菜
   ========================= */

function renderOrder(){

  const box=document.getElementById("orderList");

  if(recipes.length===0){

    box.innerHTML=
      '<div class="empty">还没有食谱 😊<br>先去「➕ 加食谱」吧！</div>';

    return;
  }

  box.innerHTML=recipes.map(r=>`

    <div class="card">

      <div class="food">🍽️</div>

      <h2>${escapeHtml(r.name)}</h2>

      <span class="tag">
        ${escapeHtml(r.category || "其他")}
      </span>

      <p>
        ${escapeHtml(r.ingredients || "")}
      </p>

      <button class="action"
        onclick="orderFood('${r.id}')">
        我要吃 ❤️
      </button>

    </div>

  `).join("");
}


/* =========================
   显示食谱
   ========================= */

function renderRecipes(){

  const box=document.getElementById("recipeList");

  if(recipes.length===0){

    box.innerHTML=
      '<div class="empty">还没有食谱 😊</div>';

    return;
  }

  box.innerHTML=recipes.map(r=>`

    <div class="card">

      <h2>🍽️ ${escapeHtml(r.name)}</h2>

      <span class="tag">
        ${escapeHtml(r.category || "其他")}
      </span>

      <p>
        <b>材料：</b><br>
        ${escapeHtml(r.ingredients || "")}
      </p>

      <p>
        <b>做法：</b><br>
        ${escapeHtml(r.instructions || "")}
      </p>

    </div>

  `).join("");
}


/* =========================
   添加食谱
   ========================= */

async function addRecipe(){

  const name=document.getElementById("name").value.trim();
  const category=document.getElementById("category").value;
  const ingredients=document.getElementById("ingredients").value.trim();
  const instructions=document.getElementById("instructions").value.trim();

  if(!name){

    alert("请先填写菜名 ❤️");
    return;
  }

  const response=await fetch(
    SUPABASE_URL + "/rest/v1/recipes",
    {
      method:"POST",

      headers:{
        "Content-Type":"application/json",
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer " + SUPABASE_KEY,
        "Prefer":"return=minimal"
      },

      body:JSON.stringify({
        name:name,
        category:category,
        ingredients:ingredients,
        instructions:instructions
      })
    }
  );

  if(response.ok){

    alert("食谱已经保存 ❤️");

    document.getElementById("name").value="";
    document.getElementById("ingredients").value="";
    document.getElementById("instructions").value="";

    await loadRecipes();

    page("recipes",document.querySelectorAll("nav button")[2]);

  }else{

    alert("保存失败，请检查 Supabase 设置。");

  }
}


/* =========================
   页面切换
   ========================= */

function page(id,button){

  ["order","today","recipes","add"].forEach(x=>{
    document.getElementById(x).classList.add("hidden");
  });

  document.getElementById(id).classList.remove("hidden");

  document.querySelectorAll("nav button").forEach(b=>{
    b.classList.remove("active");
  });

  button.classList.add("active");

  if(id==="today"){
    loadToday();
  }
}


/* =========================
   点菜
   ========================= */

function orderFood(id){

  const recipe=recipes.find(r=>String(r.id)===String(id));

  if(!recipe)return;

  let today=JSON.parse(
    localStorage.getItem("todayOrders") || "[]"
  );

  today.push({
    name:recipe.name,
    time:new Date().toLocaleTimeString("zh-CN",{
      hour:"2-digit",
      minute:"2-digit"
    })
  });

  localStorage.setItem(
    "todayOrders",
    JSON.stringify(today)
  );

  alert(recipe.name + " 已加入今日菜单 ❤️");

  loadToday();
}


/* =========================
   今日菜单
   ========================= */

function loadToday(){

  const box=document.getElementById("todayList");

  const today=JSON.parse(
    localStorage.getItem("todayOrders") || "[]"
  );

  if(today.length===0){

    box.innerHTML=
      '<div class="empty">今天还没有人点菜 😊</div>';

    return;
  }

  box.innerHTML=today.map((x,i)=>`

    <div class="card">

      <h2>🍽️ ${escapeHtml(x.name)}</h2>

      <p>点菜时间：${escapeHtml(x.time)}</p>

      <button class="delete"
        onclick="removeOrder(${i})">
        取消
      </button>

    </div>

  `).join("");
}


function removeOrder(index){

  let today=JSON.parse(
    localStorage.getItem("todayOrders") || "[]"
  );

  today.splice(index,1);

  localStorage.setItem(
    "todayOrders",
    JSON.stringify(today)
  );

  loadToday();
}


/* =========================
   防止输入内容破坏网页
   ========================= */

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================
   开始
   ========================= */

loadRecipes();

</script>

</body>
</html>
