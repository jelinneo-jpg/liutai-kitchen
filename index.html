<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f6dca5">
<title>我的记录本</title>
<style>
*{box-sizing:border-box}
:root{--bg:#fff7e7;--card:#fffdf8;--ink:#43382d;--muted:#8b7c6c;--line:#eadcc8;--accent:#d99554;--soft:#f7e7ca;--doctor:#dceee7;--shadow:0 8px 24px rgba(86,63,37,.09)}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--ink);background:linear-gradient(160deg,#fffaf0,#f7e1b8)}
button,input,textarea,select{font:inherit} button{cursor:pointer}
.wrap{max-width:720px;margin:auto;padding:18px 16px 110px}
.header{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 18px}
.title h1{font-size:27px;margin:0 0 4px}.title p{margin:0;color:var(--muted);font-size:13px}
.iconBtn{border:0;background:#fff9ed;border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px 14px;outline:none;margin:2px 0 12px}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:5px;margin-bottom:10px}
.tab{border:1px solid var(--line);background:#fffaf1;padding:8px 13px;border-radius:999px;color:#725f4c;white-space:nowrap}
.tab.active{background:#5b4b3d;color:white;border-color:#5b4b3d}
.sectionHead{display:flex;justify-content:space-between;align-items:center;margin:14px 3px 9px}
.sectionHead b{font-size:16px}.count{font-size:12px;color:var(--muted)}
.empty{text-align:center;background:rgba(255,255,255,.55);border:1px dashed #dcc9ad;border-radius:18px;padding:35px 15px;color:var(--muted)}
.card{background:var(--card);border:1px solid rgba(226,210,188,.75);border-radius:20px;padding:15px;margin-bottom:10px;box-shadow:0 5px 16px rgba(83,62,37,.06)}
.cardTop{display:flex;justify-content:space-between;gap:10px}.badge{display:inline-block;font-size:12px;border-radius:999px;padding:5px 9px;background:var(--soft);margin-bottom:7px}.badge.doctor{background:var(--doctor);color:#35604f}
.card h3{font-size:17px;margin:0 0 6px}.date{font-size:12px;color:var(--muted);white-space:nowrap}.note{white-space:pre-wrap;font-size:14px;line-height:1.55;color:#5c4f43;margin-top:8px}
.meta{margin-top:9px;padding-top:9px;border-top:1px solid #f0e6d8;font-size:13px;line-height:1.7;color:#66594c}.actions{display:flex;gap:7px;margin-top:10px;justify-content:flex-end}
.smallBtn{border:0;border-radius:10px;padding:7px 10px;background:#f4eadc;color:#5d4c3c}.danger{background:#f8e3df;color:#934c40}
.modal{display:none;position:fixed;inset:0;background:rgba(42,34,27,.38);z-index:20;padding:18px;overflow:auto}.modal.show{display:block}
.sheet{max-width:680px;margin:30px auto;background:#fffaf2;border-radius:25px;padding:19px;box-shadow:0 18px 50px rgba(0,0,0,.18)}.sheet h2{margin:2px 0 15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:11px}.field label{display:block;font-size:12px;color:#786857;margin:0 0 5px}
.field input,.field textarea,.field select,.sheet>input,.sheet>textarea,.sheet>select{width:100%;border:1px solid #e5d6c1;background:white;border-radius:12px;padding:11px;outline:none}
.field textarea{min-height:88px;resize:vertical}.full{grid-column:1/-1}.modalBtns{display:flex;gap:9px;margin-top:8px}.modalBtns button{flex:1;border:0;border-radius:13px;padding:12px;font-weight:700}
.save{background:#544538;color:white;border:0}.cancel{background:#eee3d4;color:#655647}.hidden{display:none!important}
.medCompact{padding:12px 13px;margin-bottom:8px;border-radius:16px}.medCompact h3{font-size:16px;margin-bottom:3px}.medCompact .meta{margin-top:6px;padding-top:6px}.medCompact .actions{margin-top:7px}
.moreWrap{position:relative}.moreBtn{border:0;background:#f4eadc;border-radius:10px;padding:5px 10px;font-size:20px;line-height:1}.moreMenu{position:absolute;right:0;top:34px;z-index:8;min-width:120px;background:white;border:1px solid #eadcc8;border-radius:12px;padding:5px;box-shadow:0 8px 24px rgba(60,45,30,.15)}.moreMenu button{display:block;width:100%;border:0;background:white;text-align:left;padding:9px 10px;border-radius:8px;color:#5d4c3c}
.actionbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}.actionbar .primary{background:#544538;color:#fff;border:0;border-radius:13px;padding:10px 14px;font-weight:700}
@media(max-width:560px){.grid{grid-template-columns:1fr}.sheet{margin:5px auto}.wrap{padding-top:13px}}
</style></head>
<body>
<div class="wrap">
 <div class="header"><div class="title"><h1>📒 我的记录本</h1><p>生活小事和看医生资料，都放在这里</p></div><button class="iconBtn" onclick="openSettings()">⚙️</button></div>
 <input id="search" class="search" placeholder="🔍 搜索记录……" oninput="render()">
 <div class="tabs">
  <button class="tab" data-page="life" onclick="openPage('life',this)">🏠 生活</button>
  <button class="tab" data-page="medical" onclick="openPage('medical',this)">🏥 医疗</button>
  <button class="tab" data-page="special" onclick="openPage('special',this)">✨ 特别日子</button>
  <button class="tab" data-page="shopping" onclick="openPage('shopping',this)">🛒 购物清单</button>
  <span id="customTabs"></span>
  <button class="tab" onclick="openAddPageForm()">＋ 添加页面</button>
 </div>
 <div id="pageActions"></div>
 <div class="sectionHead"><b id="listTitle"></b><span id="count" class="count"></span></div>
 <div id="list"></div>
</div>

<div id="medicalRecordModal" class="modal"><div class="sheet"><h2 id="medicalRecordTitle">＋ 看医生</h2><input type="hidden" id="medicalRecordId">
 <div class="grid"><div class="field"><label>日期</label><input type="date" id="medicalDate"></div><div class="field full"><label>名称</label><input id="medicalName" placeholder="例如：看骨科、看中医、牙医"></div><div class="field"><label>金额</label><input id="medicalAmount" inputmode="decimal"></div><div class="field full"><label>备注</label><textarea id="medicalNotes"></textarea></div></div>
 <div class="modalBtns"><button class="cancel" onclick="closeModal('medicalRecordModal')">取消</button><button class="save" onclick="saveMedicalRecord()">保存</button></div></div></div>

<div id="packageModal" class="modal"><div class="sheet"><h2 id="packageFormTitle">📦 添加配套</h2><input type="hidden" id="packageEditId">
 <div class="grid"><div class="field full"><label>配套名称</label><input id="packageName"></div><div class="field"><label>配套金额</label><input id="packageAmount" inputmode="decimal"></div><div class="field"><label>拉腰 / 拉颈项共享次数</label><input id="packageStretchTotal" type="number" min="1" value="16"></div><div class="field"><label>Chiro 次数</label><input id="packageChiroTotal" type="number" min="1" value="8"></div><div class="field full"><label>诊所 / 医生（选填）</label><input id="packageClinic"></div><div class="field full"><label>备注（选填）</label><textarea id="packageNotes"></textarea></div></div>
 <div class="modalBtns"><button class="cancel" onclick="closeModal('packageModal')">取消</button><button class="save" onclick="savePackage()">保存配套</button></div></div></div>

<div id="sessionModal" class="modal"><div class="sheet"><h2 id="sessionTitle">记录治疗</h2><input type="hidden" id="sessionEditIndex">
 <div class="grid"><div class="field"><label>日期</label><input id="sessionDate" type="date"></div><div class="field full"><label>本次项目</label><div style="display:flex;gap:10px;flex-wrap:wrap"><label><input type="checkbox" id="sessionWaist"> 拉腰</label><label><input type="checkbox" id="sessionNeck"> 拉颈项</label><label><input type="checkbox" id="sessionChiro"> Chiro</label></div></div><div class="field full"><label>备注</label><textarea id="sessionNotes"></textarea></div></div>
 <div class="modalBtns"><button class="cancel" onclick="closeModal('sessionModal')">取消</button><button class="save" onclick="saveSession()">保存</button></div></div></div>

<div id="moneyModal" class="modal"><div class="sheet"><div style="display:flex;justify-content:space-between"><h2>💰 金钱记录</h2><button class="smallBtn" onclick="closeModal('moneyModal')">✕</button></div><div id="moneyList"></div><div id="moneyTotal" style="margin-top:14px;padding:14px;background:#f6ead7;border-radius:14px;font-size:18px;font-weight:800"></div></div></div>

<div id="specialModal" class="modal"><div class="sheet"><h2>✨ 添加特别日子</h2><input type="hidden" id="specialId">
 <div class="field"><label>名称</label><input id="spTitle"></div><div class="field"><label>分类</label><select id="spType"><option value="birthday">🎂 生日</option><option value="anniversary">💕 纪念日</option></select></div><div class="field"><label>日期</label><input id="spDate" type="date"></div><div class="field"><label>备注</label><textarea id="spNotes"></textarea></div>
 <div class="modalBtns"><button class="cancel" onclick="closeModal('specialModal')">取消</button><button class="save" onclick="saveSpecial()">保存</button></div></div></div>

<div id="shoppingModal" class="modal"><div class="sheet"><h2>🛒 添加物品</h2><input type="hidden" id="shoppingId">
 <div class="field"><label>物品名称</label><input id="shopTitle"></div><div class="field"><label>数量 / 备注</label><input id="shopNotes"></div><div class="field"><label>照片</label><input id="shopPhoto" type="file" accept="image/*"><div id="shopPhotoStatus" class="note"></div></div>
 <div class="modalBtns"><button class="cancel" onclick="closeModal('shoppingModal')">取消</button><button class="save" onclick="saveShopping()">加入清单</button></div></div></div>

<div id="photoViewerModal" class="modal" onclick="closeModal('photoViewerModal')"><div class="sheet" onclick="event.stopPropagation()"><img id="photoViewerImg" style="width:100%;max-height:75vh;object-fit:contain;border-radius:14px"></div></div>

<div id="normalModal" class="modal"><div class="sheet"><h2>📝 添加记录</h2><input type="hidden" id="normalId">
 <div class="field"><label>日期</label><input id="normalDate" type="date"></div><div class="field"><label>名称</label><input id="normalTitle"></div><div id="normalCatWrap" class="field"><label>分类</label><select id="normalCat"></select></div><div class="field"><label>备注</label><textarea id="normalNotes"></textarea></div>
 <div class="modalBtns"><button class="cancel" onclick="closeModal('normalModal')">取消</button><button class="save" onclick="saveNormal()">保存</button></div></div></div>

<div id="addPageModal" class="modal"><div class="sheet"><h2>＋ 添加页面</h2>
 <div class="field"><label>页面名称</label><input id="pageName" placeholder="例如：宠物"></div><div class="field"><label>图标</label><input id="pageIcon" placeholder="例如：🐶" maxlength="4"></div>
 <div class="field"><label>Layout</label><select id="pageLayout" onchange="toggleCategoryField()"><option value="normal">📝 普通记录</option><option value="medical">🏥 医疗 Layout</option><option value="checklist">🛒 清单 Layout</option><option value="special">✨ 特别日子 Layout</option></select></div>
 <div id="pageCatField" class="field"><label>分类</label><input id="pageCategories" placeholder="例如：洗澡、美容、用品"><div class="note">多个分类用逗号分开</div></div>
 <div class="modalBtns"><button class="cancel" onclick="closeModal('addPageModal')">取消</button><button class="save" onclick="saveCustomPage()">添加页面</button></div></div></div>

<div id="settingsModal" class="modal"><div class="sheet"><h2>⚙️ 资料备份</h2><p class="note">备份会包含记录和你自己新增的页面。</p><div class="modalBtns"><button class="cancel" onclick="closeModal('settingsModal')">关闭</button><button class="save" onclick="exportData()">📤 导出备份</button></div><input id="importFile" type="file" accept=".json" onchange="importData(event)" style="margin-top:12px"></div></div>

<script>
const KEY='myRecordBook_v1', PAGEKEY='myRecordCustomPages';
let records=JSON.parse(localStorage.getItem(KEY)||'[]');
let customPages=JSON.parse(localStorage.getItem(PAGEKEY)||'[]');
let currentPage='life', currentPackageId=null;
const $=id=>document.getElementById(id), today=()=>new Date().toISOString().slice(0,10);
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function saveAll(){localStorage.setItem(KEY,JSON.stringify(records));localStorage.setItem(PAGEKEY,JSON.stringify(customPages))}
function pageObj(){
 if(currentPage==='life')return{id:'life',name:'生活',icon:'🏠',layout:'normal',categories:[]};
 if(currentPage==='medical')return{id:'medical',name:'医疗',icon:'🏥',layout:'medical',builtin:true};
 if(currentPage==='special')return{id:'special',name:'特别日子',icon:'✨',layout:'special',builtin:true};
 if(currentPage==='shopping')return{id:'shopping',name:'购物清单',icon:'🛒',layout:'checklist',builtin:true};
 return customPages.find(p=>p.id===currentPage);
}
function scopeId(){return pageObj()?.builtin?'':currentPage==='life'?'':currentPage}
function belongs(r,p=pageObj()){
 if(p.layout==='medical')return (r.category==='medicalRecord'||r.category==='package') && (p.builtin?!r.customPageId:r.customPageId===p.id);
 if(p.layout==='special')return r.category==='special' && (p.builtin?!r.customPageId:r.customPageId===p.id);
 if(p.layout==='checklist')return r.category==='shopping' && (p.builtin?!r.customPageId:r.customPageId===p.id);
 return p.id==='life' ? r.category==='life' : r.category==='custom'&&r.customPageId===p.id;
}
function renderTabs(){ $('customTabs').innerHTML=customPages.map(p=>`<button class="tab" data-page="${p.id}" onclick="openPage('${p.id}',this)">${esc(p.icon||'📌')} ${esc(p.name)}</button>`).join('') }
function openPage(id,btn){
 currentPage=id;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
 (btn||document.querySelector(`[data-page="${id}"]`))?.classList.add('active');
 render();
}
function renderActions(p){
 let html='<div class="actionbar">';
 if(p.layout==='medical')html+=`<button class="primary" onclick="openMedicalRecordForm()">＋ 看医生</button><button class="primary" onclick="openPackageForm()">＋ 配套</button><button class="smallBtn" onclick="openMoneyModal()">💰 金钱</button>`;
 else if(p.layout==='special')html+=`<button class="smallBtn" onclick="openSpecialForm()">＋ 添加</button>`;
 else if(p.layout==='checklist')html+=`<button class="smallBtn" onclick="openShoppingForm()">＋ 添加</button>`;
 else html+=`<button class="smallBtn" onclick="openNormalForm()">＋ 添加</button>`;
 if(!p.builtin&&p.id!=='life')html+=`<button class="smallBtn danger" onclick="deleteCurrentPage()">🗑️ 删除页面</button>`;
 return html+'</div>';
}
function render(){
 const p=pageObj(); if(!p){currentPage='life';return render()}
 $('pageActions').innerHTML=renderActions(p);$('listTitle').textContent=`${p.icon||'📌'} ${p.name}`;
 const q=$('search').value.trim().toLowerCase();let arr=records.filter(r=>belongs(r,p)).filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q));
 if(p.layout==='checklist')return renderChecklist(arr);
 arr.sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.created||0)-(a.created||0));$('count').textContent=arr.length+' 条';
 if(!arr.length){$('list').innerHTML='<div class="empty">还没有记录 🌿</div>';return}
 $('list').innerHTML=arr.map(r=>p.layout==='medical'?medicalCard(r):p.layout==='special'?specialCard(r):normalCard(r)).join('');
}
function medicalCard(r){
 if(r.category==='medicalRecord')return `<div class="card medCompact"><div class="cardTop"><div><div><span class="badge doctor">🏥 医疗 · 看医生</span> <span class="date">${esc(r.date||'')}</span></div><h3>${esc(r.title)}</h3></div><div><button class="smallBtn" onclick="openMedicalRecordForm('${r.id}')">✏️</button> <button class="smallBtn danger" onclick="deleteRecord('${r.id}')">🗑️</button></div></div>${r.notes?`<div class="note">${esc(r.notes)}</div>`:''}</div>`;
 const ss=r.sessions||[],st=+r.stretchTotal||16,ct=+r.chiroTotal||8,su=ss.reduce((n,x)=>n+(x.waist?1:0)+(x.neck?1:0)+(x.stretch&&!x.waist&&!x.neck?1:0),0),cu=ss.filter(x=>x.chiro).length;
 return `<div class="card medCompact"><div class="cardTop"><div><span class="badge doctor">🏥 医疗 · 配套</span><h3>${esc(r.title)}</h3></div><div><button class="smallBtn" onclick="openPackageForm('${r.id}')">✏️</button> <button class="smallBtn danger" onclick="deleteRecord('${r.id}')">🗑️</button></div></div><div class="meta"><b>拉腰 / 拉颈项：${su}/${st}</b> ｜ <b>Chiro：${cu}/${ct}</b></div><div class="actions"><button class="smallBtn" onclick="openSessionForm('${r.id}')">＋ 记录治疗</button><button class="smallBtn" onclick="toggleHistory('${r.id}')">治疗记录 ▼</button></div><div id="history_${r.id}" class="hidden"></div></div>`;
}
function specialCard(r){return `<div class="card medCompact"><div class="cardTop"><div><div class="date">${esc(r.date)}</div><div style="display:flex;gap:8px;align-items:center;margin-top:7px"><span class="badge">${r.specialType==='birthday'?'🎂 生日':'💕 纪念日'}</span><h3>${esc(r.title)}</h3></div></div><div><button class="smallBtn" onclick="openSpecialForm('${r.id}')">✏️</button> <button class="smallBtn danger" onclick="deleteRecord('${r.id}')">🗑️</button></div></div>${r.notes?`<div class="note">${esc(r.notes)}</div>`:''}<div class="actions"><button class="smallBtn" onclick="addCalendar('${r.id}')">📅 加入日历</button></div></div>`}
function normalCard(r){return `<div class="card medCompact"><div class="cardTop"><div><span class="date">${esc(r.date||'')}</span>${r.recordCategory?` <span class="badge">${esc(r.recordCategory)}</span>`:''}<h3>${esc(r.title)}</h3></div><div><button class="smallBtn" onclick="openNormalForm('${r.id}')">✏️</button> <button class="smallBtn danger" onclick="deleteRecord('${r.id}')">🗑️</button></div></div>${r.notes?`<div class="note">${esc(r.notes)}</div>`:''}</div>`}
function renderChecklist(arr){
 const pending=arr.filter(x=>!x.done),done=arr.filter(x=>x.done);$('count').textContent=arr.length+' 项';
 const item=r=>`<div class="card medCompact" style="${r.done?'opacity:.68':''}"><div style="display:flex;gap:9px;align-items:flex-start"><button style="border:0;background:none;font-size:22px" onclick="toggleShopping('${r.id}')">${r.done?'☑️':'☐'}</button><div style="flex:1"><b style="${r.done?'text-decoration:line-through':''}">${esc(r.title)}</b>${r.notes?`<div class="note">${esc(r.notes)}</div>`:''}</div>${r.photo?`<button class="smallBtn" onclick="viewPhoto('${r.id}')">📷</button>`:''}<button class="smallBtn danger" onclick="deleteRecord('${r.id}')">🗑️</button></div></div>`;
 $('list').innerHTML=`<h3>未完成 <span class="count">${pending.length}</span></h3>${pending.map(item).join('')||'<div class="note">没有未完成物品 🎉</div>'}<h3 style="margin-top:20px">已完成 ✅ <span class="count">${done.length}</span></h3>${done.map(item).join('')||'<div class="note">还没有完成物品</div>'}`;
}
function closeModal(id){$(id).classList.remove('show')}
function deleteRecord(id){if(confirm('确定删除吗？')){records=records.filter(x=>x.id!==id);saveAll();render()}}
function openMedicalRecordForm(id=''){const r=records.find(x=>x.id===id);$('medicalRecordId').value=id;$('medicalDate').value=r?.date||today();$('medicalName').value=r?.title||'';$('medicalAmount').value=r?.amount||'';$('medicalNotes').value=r?.notes||'';$('medicalRecordModal').classList.add('show')}
function saveMedicalRecord(){const id=$('medicalRecordId').value||'m'+Date.now(),old=records.find(x=>x.id===id),r={id,created:old?.created||Date.now(),date:$('medicalDate').value||today(),category:'medicalRecord',customPageId:old?.customPageId||scopeId(),title:$('medicalName').value.trim()||'看医生',amount:$('medicalAmount').value.trim(),notes:$('medicalNotes').value.trim()};const i=records.findIndex(x=>x.id===id);i>=0?records[i]=r:records.push(r);saveAll();closeModal('medicalRecordModal');render()}
function openPackageForm(id=''){const r=records.find(x=>x.id===id);$('packageEditId').value=id;$('packageName').value=r?.title||'';$('packageAmount').value=r?.amount||'';$('packageStretchTotal').value=r?.stretchTotal||16;$('packageChiroTotal').value=r?.chiroTotal||8;$('packageClinic').value=r?.clinic||'';$('packageNotes').value=r?.notes||'';$('packageModal').classList.add('show')}
function savePackage(){const id=$('packageEditId').value||'pk'+Date.now(),old=records.find(x=>x.id===id),r={id,created:old?.created||Date.now(),date:old?.date||today(),category:'package',customPageId:old?.customPageId||scopeId(),title:$('packageName').value.trim()||'医生配套',amount:$('packageAmount').value.trim(),stretchTotal:Math.max(1,+$('packageStretchTotal').value||16),chiroTotal:Math.max(1,+$('packageChiroTotal').value||8),clinic:$('packageClinic').value.trim(),notes:$('packageNotes').value.trim(),sessions:old?.sessions||[]};const i=records.findIndex(x=>x.id===id);i>=0?records[i]=r:records.push(r);saveAll();closeModal('packageModal');render()}
function openSessionForm(id,index=''){currentPackageId=id;const r=records.find(x=>x.id===id),x=index===''?null:r?.sessions?.[index];$('sessionEditIndex').value=index;$('sessionDate').value=x?.date||today();$('sessionWaist').checked=!!x?.waist;$('sessionNeck').checked=!!x?.neck;$('sessionChiro').checked=!!x?.chiro;$('sessionNotes').value=x?.notes||'';$('sessionModal').classList.add('show')}
function saveSession(){const r=records.find(x=>x.id===currentPackageId);if(!r)return;r.sessions=r.sessions||[];const x={date:$('sessionDate').value||today(),waist:$('sessionWaist').checked,neck:$('sessionNeck').checked,chiro:$('sessionChiro').checked,notes:$('sessionNotes').value.trim()},idx=$('sessionEditIndex').value,test=[...r.sessions];idx===''?test.push(x):test[+idx]=x;const su=test.reduce((n,a)=>n+(a.waist?1:0)+(a.neck?1:0),0),cu=test.filter(a=>a.chiro).length;if(su>(+r.stretchTotal||16)){alert('拉腰 / 拉颈项次数已超过配套次数');return}if(cu>(+r.chiroTotal||8)){alert('Chiro 次数已超过配套次数');return}idx===''?r.sessions.push(x):r.sessions[+idx]=x;saveAll();closeModal('sessionModal');render();setTimeout(()=>toggleHistory(r.id,true),0)}
function toggleHistory(id,force=false){const box=$('history_'+id),r=records.find(x=>x.id===id);if(!box||!r)return;if(!force&&!box.classList.contains('hidden')){box.classList.add('hidden');return}box.innerHTML=(r.sessions||[]).map((x,i)=>`<div class="meta"><b>${esc(x.date||'')}</b><div class="note">${[x.waist?'☑ 拉腰':'',x.neck?'☑ 拉颈项':'',x.chiro?'☑ Chiro':''].filter(Boolean).join('　')}</div>${x.notes?`<div class="note">${esc(x.notes)}</div>`:''}<div class="actions"><button class="smallBtn" onclick="openSessionForm('${id}',${i})">✏️ 编辑</button><button class="smallBtn danger" onclick="deleteSession('${id}',${i})">🗑️</button></div></div>`).join('')||'<div class="note">还没有治疗记录</div>';box.classList.remove('hidden')}
function deleteSession(id,i){if(confirm('确定删除这一次治疗记录吗？')){const r=records.find(x=>x.id===id);r.sessions.splice(i,1);saveAll();render();setTimeout(()=>toggleHistory(id,true),0)}}
function amountNum(v){const n=parseFloat(String(v||'').replace(/[^0-9.-]/g,''));return isNaN(n)?0:n}
function openMoneyModal(){const arr=records.filter(r=>belongs(r)&&amountNum(r.amount)>0),total=arr.reduce((n,r)=>n+amountNum(r.amount),0);$('moneyList').innerHTML=arr.map(r=>`<div style="display:flex;justify-content:space-between;padding:11px 2px;border-bottom:1px solid #eee2d3"><div><b>${esc(r.title)}</b><div class="date">${r.category==='package'?'配套':'看医生'}</div></div><b>${esc(r.amount)}</b></div>`).join('')||'<div class="empty">还没有金额记录</div>';$('moneyTotal').textContent='总金额：'+total.toFixed(2);$('moneyModal').classList.add('show')}
function openSpecialForm(id=''){const r=records.find(x=>x.id===id);$('specialId').value=id;$('spTitle').value=r?.title||'';$('spType').value=r?.specialType||'birthday';$('spDate').value=r?.date||'';$('spNotes').value=r?.notes||'';$('specialModal').classList.add('show')}
function saveSpecial(){const id=$('specialId').value||'sp'+Date.now(),old=records.find(x=>x.id===id),title=$('spTitle').value.trim(),date=$('spDate').value;if(!title||!date){alert('请填写日期和名称');return}const r={id,created:old?.created||Date.now(),category:'special',customPageId:old?.customPageId||scopeId(),specialType:$('spType').value,date,title,notes:$('spNotes').value.trim()};const i=records.findIndex(x=>x.id===id);i>=0?records[i]=r:records.push(r);saveAll();closeModal('specialModal');render()}
function addCalendar(id){const r=records.find(x=>x.id===id),d=r.date.replaceAll('-',''),n=new Date(+r.date.slice(0,4),+r.date.slice(5,7)-1,+r.date.slice(8,10)+1),end=`${n.getFullYear()}${String(n.getMonth()+1).padStart(2,'0')}${String(n.getDate()).padStart(2,'0')}`,ics=['BEGIN:VCALENDAR','VERSION:2.0','BEGIN:VEVENT','DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+end,'RRULE:FREQ=YEARLY','SUMMARY:'+(r.specialType==='birthday'?'生日 - ':'纪念日 - ')+r.title,'END:VEVENT','END:VCALENDAR'].join('\r\n'),blob=new Blob([ics],{type:'text/calendar'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=r.title+'.ics';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function openShoppingForm(id=''){const r=records.find(x=>x.id===id);$('shoppingId').value=id;$('shopTitle').value=r?.title||'';$('shopNotes').value=r?.notes||'';$('shopPhoto').value='';$('shopPhotoStatus').textContent=r?.photo?'📷 已有照片，不重新选择会保留':'';$('shoppingModal').classList.add('show')}
function compress(file){return new Promise((res,rej)=>{if(!file)return res('');const fr=new FileReader;fr.onload=()=>{const im=new Image;im.onload=()=>{const sc=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
async function saveShopping(){const id=$('shoppingId').value||'sh'+Date.now(),old=records.find(x=>x.id===id),title=$('shopTitle').value.trim();if(!title){alert('请填写物品');return}let photo=old?.photo||'';if($('shopPhoto').files[0])photo=await compress($('shopPhoto').files[0]);const r={id,created:old?.created||Date.now(),category:'shopping',customPageId:old?.customPageId||scopeId(),title,notes:$('shopNotes').value.trim(),photo,done:old?.done||false};const i=records.findIndex(x=>x.id===id);i>=0?records[i]=r:records.push(r);saveAll();closeModal('shoppingModal');render()}
function toggleShopping(id){const r=records.find(x=>x.id===id);r.done=!r.done;saveAll();render()} function viewPhoto(id){$('photoViewerImg').src=records.find(x=>x.id===id)?.photo||'';$('photoViewerModal').classList.add('show')}
function openNormalForm(id=''){const p=pageObj(),r=records.find(x=>x.id===id);$('normalId').value=id;$('normalDate').value=r?.date||today();$('normalTitle').value=r?.title||'';$('normalNotes').value=r?.notes||'';const cats=p.categories||[];$('normalCatWrap').style.display=cats.length?'block':'none';$('normalCat').innerHTML=cats.map(c=>`<option>${esc(c)}</option>`).join('');if(r?.recordCategory)$('normalCat').value=r.recordCategory;$('normalModal').classList.add('show')}
function saveNormal(){const p=pageObj(),id=$('normalId').value||'n'+Date.now(),old=records.find(x=>x.id===id),title=$('normalTitle').value.trim();if(!title){alert('请填写名称');return}const r={id,created:old?.created||Date.now(),category:p.id==='life'?'life':'custom',customPageId:p.id==='life'?'':p.id,date:$('normalDate').value||today(),title,recordCategory:(p.categories||[]).length?$('normalCat').value:'',notes:$('normalNotes').value.trim()};const i=records.findIndex(x=>x.id===id);i>=0?records[i]=r:records.push(r);saveAll();closeModal('normalModal');render()}
function openAddPageForm(){$('pageName').value='';$('pageIcon').value='';$('pageLayout').value='normal';$('pageCategories').value='';toggleCategoryField();$('addPageModal').classList.add('show')}
function toggleCategoryField(){$('pageCatField').style.display=$('pageLayout').value==='normal'?'block':'none'}
function saveCustomPage(){const name=$('pageName').value.trim();if(!name){alert('请填写页面名称');return}const p={id:'page'+Date.now(),name,icon:$('pageIcon').value.trim()||'📌',layout:$('pageLayout').value,categories:$('pageCategories').value.split(/[，,]/).map(x=>x.trim()).filter(Boolean)};customPages.push(p);saveAll();renderTabs();closeModal('addPageModal');openPage(p.id)}
function deleteCurrentPage(){const p=pageObj();if(!p||p.builtin||p.id==='life')return;if(confirm(`确定删除「${p.name}」页面吗？\n\n页面里面的记录也会一起删除。`)){records=records.filter(r=>r.customPageId!==p.id);customPages=customPages.filter(x=>x.id!==p.id);saveAll();renderTabs();openPage('life')}}
function openSettings(){$('settingsModal').classList.add('show')}
function exportData(){const blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),records,customPages},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='我的记录本备份_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(e){const f=e.target.files[0];if(!f)return,0;const rd=new FileReader;rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!Array.isArray(d.records))throw 0;if(confirm('导入会替换目前资料，确定吗？')){records=d.records;customPages=Array.isArray(d.customPages)?d.customPages:customPages;saveAll();renderTabs();render();alert('导入完成')}}catch{alert('备份文件无法读取')}};rd.readAsText(f)}
renderTabs();openPage('life');
</script></body></html>
